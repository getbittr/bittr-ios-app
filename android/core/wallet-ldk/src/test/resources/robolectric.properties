# Robolectric runs this module's tests at the SDK :app actually targets.
#
# Without this line three tests in this module fail at initialisation, before a
# single assertion runs:
#
#   Package targetSdkVersion=37 > maxSdkVersion=36
#
# The cause is that :core:wallet-ldk is a LIBRARY. Libraries declare no
# targetSdk, so the manifest Robolectric reads falls back to compileSdk, which
# is 37 — one ahead of the newest SDK Robolectric 4.16.1 ships a shadow set for.
# :app does not hit this because it sets targetSdk = 36 explicitly.
#
# 36, AND THE JDK THAT MAKES 36 REACHABLE
#
# Robolectric 4.16.1 declares a minimum JDK per SDK level. Read off the table in
# org.robolectric.plugins.DefaultSdkProvider rather than from memory:
#
#   SDK 33 -> Java 9    SDK 34 -> Java 17
#   SDK 35 -> Java 17   SDK 36 -> Java 21
#
# This file sat at 35 for one commit, because the workflow pinned
# JAVA_VERSION: '17' and SDK 36 could not be loaded at all:
#
#   Failed to create a Robolectric sandbox: Android SDK 36 requires Java 21
#   (have Java 17)
#
# That was fixing the wrong end. The workflow now installs both 17 and 21 and
# runs Gradle on 21 (see the JAVA_VERSION comment in
# .github/workflows/android-maestro.yml), so 36 is reachable and the ceiling is
# gone. Bytecode targets are unchanged — every module still compiles for 17.
#
# Tests that care about a specific level still pin their own, and an explicit
# @Config always wins over this default. In this module that is not optional:
# RobolectricSdkPinGuardTest requires every Robolectric class here to state the
# levels its claim holds at, on the grounds that a level inherited from
# compileSdk is a level nobody chose. KeystoreKeySpecTest pins [28, 34] for a
# documented reason of its own; the house triple is [26, 34, 36].
#
# WHY THE SDK-36 FAILURE WAS GREEN LOCALLY AND RED IN CI
#
# Worth stating exactly, because the first version of this comment guessed at it
# and guessed wrong (it blamed cached Robolectric jars). These modules set
# jvmTarget/sourceCompatibility, which choose a BYTECODE level; they do not set a
# toolchain for the test JVM. So the tests run on whatever JDK Gradle itself is
# running on — Java 21 on the machines these were written on, Java 17 in CI.
# The divergence was the JDK, not the SDK, and CI now matches the machines.
#
# Found by BIT-59, which is the first thing to run this module's tests in CI at
# all.
sdk=36
