# Robolectric runs this module's tests at the highest SDK the repo's pinned JDK
# can actually load shadows for.
#
# Without this line three tests in this module fail at initialisation, before a
# single assertion runs:
#
#   Package targetSdkVersion=37 > maxSdkVersion=36
#
# The cause is that :core:wallet-ldk is a LIBRARY. Libraries declare no
# targetSdk, so the manifest Robolectric reads falls back to compileSdk, which
# is 37 — one ahead of the newest SDK Robolectric 4.16.1 ships a shadow set for.
# :app does not hit this because it sets targetSdk = 36 explicitly.
#
# 35 RATHER THAN 36, AND WHY THAT IS A CEILING AND NOT A PREFERENCE
#
# This file said 36 first, on the reasoning that 36 is what :app targets, so the
# JVM tests would exercise the API level the shipped app declares. That is a good
# reason and it is not available to us. Run 61 failed all three tests again, one
# step further in:
#
#   Failed to create a Robolectric sandbox: Android SDK 36 requires Java 21
#   (have Java 17)
#
# Robolectric 4.16.1 declares a minimum JDK per SDK level. Read off the table in
# org.robolectric.plugins.DefaultSdkProvider rather than from memory:
#
#   SDK 33 -> Java 9    SDK 34 -> Java 17
#   SDK 35 -> Java 17   SDK 36 -> Java 21
#
# The workflow pins JAVA_VERSION: '17' (.github/workflows/android-maestro.yml),
# and every module here is compiled for 17 — jvmToolchain(17) in the four
# pure-Kotlin modules, JavaVersion.VERSION_17 in the five Android ones. So 35 is
# not a stylistic choice over 36; it is the maximum this toolchain can load. 36
# becomes available the day the repo moves to JDK 21, which is a decision for the
# whole build and not something BIT-59 should make on its way past.
#
# Tests that care about a specific level still pin their own — KeystoreKeySpecTest
# uses @Config(sdk = [28, 34]) to cover the software-keystore fallback — and an
# explicit @Config always wins over this default. That is also why :app's two
# Robolectric tests were never affected by any of this: both pin @Config(sdk =
# [34]).
#
# WHY THIS WAS GREEN LOCALLY AND RED IN CI
#
# Worth stating exactly, because the first version of this comment guessed at it
# and guessed wrong (it blamed cached Robolectric jars). These modules set
# jvmTarget/sourceCompatibility, which choose a BYTECODE level; they do not set a
# toolchain for the test JVM. So the tests run on whatever JDK Gradle itself is
# running on — Java 21 on the machines these were written on, Java 17 in CI. At
# 21 the sandbox for SDK 36 loads and the suite is green. The divergence is the
# JDK, not the SDK.
#
# Found by BIT-59, which is the first thing to run this module's tests in CI at
# all.
sdk=35
