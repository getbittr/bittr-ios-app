# Robolectric runs this module's tests at the SDK the app actually targets.
#
# Without this line three tests in this module fail at initialisation, before a
# single assertion runs:
#
#   Package targetSdkVersion=37 > maxSdkVersion=36
#
# The cause is that :core:wallet-ldk is a LIBRARY. Libraries declare no
# targetSdk, so the manifest Robolectric reads falls back to compileSdk, which
# is 37 — one ahead of the newest SDK Robolectric 4.16.1 ships a shadow set for.
# :app does not hit this because it sets targetSdk = 36 explicitly.
#
# 36 rather than 34: it is what :app targets (libs.versions.toml targetSdk), so
# the JVM tests exercise the same API level the shipped app declares. Tests that
# care about a specific level still pin their own — KeystoreKeySpecTest uses
# @Config(sdk = [28, 34]) to cover the software-keystore fallback — and an
# explicit @Config always wins over this default.
#
# Found by BIT-59, which is the first thing to run this module's tests in CI at
# all. They passed locally for whoever wrote them because a local run picks up
# whatever Robolectric jars are already cached; CI resolves the pinned version.
sdk=36
