[versions]
# Toolchain.
#
# AGP 9 is not optional here: Hilt's Gradle plugin dropped AGP 8 at 2.59, and Hilt
# is the DI container. Pinning AGP 8 would mean starting a multi-month port on a
# toolchain the DI framework has already stopped supporting.
#
# KSP changed its version scheme at 2.3.0 — it used to be <kotlin>-<ksp> (e.g.
# 2.2.21-2.0.5) and is now independent of the Kotlin version. Do not go looking for
# a KSP release matching the Kotlin version; there isn't one any more.
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.11"
hilt = "2.60.1"

# SDK levels. minSdk 26 per ANDROID_PORT_PLAN.md — full Keystore/biometric support,
# no legacy key-storage workarounds for the wallet layer.
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

# AndroidX / Compose
androidxCore = "1.19.0"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
composeBom = "2026.08.00"
navigationCompose = "2.10.0"
hiltNavigationCompose = "1.4.0"

# CameraX, for the scanner (BIT-72). Four artefacts, and the set is the point:
# camera-core (the use cases), camera-camera2 (the implementation that drives the
# hardware), camera-lifecycle (bindToLifecycle) and camera-compose (the viewfinder).
#
# The two capture artefacts CameraX also publishes are deliberately absent, and
# CameraCaptureGuardTest fails the build if either arrives — the scanner's approved
# copy says nothing is recorded (DEV-37, BIT-15 -> decision-brief D1). camera-compose
# rather than camera-view for the viewfinder is part of that: camera-view depends on
# the video artefact, which declares RECORD_AUDIO in its own manifest, while
# camera-compose depends on camera-core and the viewfinder and nothing else.
cameraX = "1.6.2"

# QR decoding. Pure Java, no Android types, so the decode path is covered by a real
# JVM test that encodes a QR and reads it back rather than by an emulator. ML Kit is
# the usual Android answer and cannot do that; it also carries a model download and a
# Play-services dependency for what AVFoundation does natively on iOS.
zxing = "3.5.4"
# Wallet core (BIT-6).
#
# bdk-android and ldk-node-android are pinned to the versions iOS runs, not to
# the latest release. The reasoning and the cost of the alternative are in the
# `wallet-core-spec` document §1: bdk-android 3.0.0 removes `Connection` in
# favour of `Persister` and splits `Network`/`NetworkKind`, which is a redesign
# of the storage seam rather than a rename, while the acceptance bar for this
# port is behavioural parity with the iOS suite. Upgrade both platforms
# together, later, as its own piece of work.
bdk = "1.2.0"          # iOS pins bdk-swift 1.2.0
ldkNode = "0.7.0"      # iOS pins ldk-node 0.7.0

# bitcoin-kmp supplies BIP39/BIP32 on the JVM. It is here for two jobs neither
# BDK nor ldk-node can do: (1) deriving the BIP84 account xpub for the seed
# discriminator (BIT-20 rule 1) *before* any node has been booted against the
# state directory whose provenance is in question, and (2) letting the iOS
# derivation vectors run as plain JVM unit tests instead of only on an emulator.
# Both bindings above are UniFFI wrappers over native .so files, so anything
# built on them is emulator-only by construction.
bitcoinKmp = "0.31.0"
secp256k1Kmp = "0.23.0"  # the version bitcoin-kmp-jvm 0.31.0 resolves; JNI half added explicitly

# Test
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
coroutines = "1.11.0"
robolectric = "4.16.1"

# Map renderer (BIT-53). MapLibre Native, not Google Maps and not Mapbox — the
# reasoning is in android/docs/map-sdk-decision.md and it is a privacy constraint
# rather than a taste preference, so read that before swapping it. Enforced by
# MapSdkGuardTest.
maplibre = "11.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# For androidx.lifecycle.compose.LocalLifecycleOwner, which is what CameraX's
# bindToLifecycle needs from a composable. The identically named composition local
# in androidx.compose.ui.platform was deprecated in Compose 1.7 and is gone now.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "cameraX" }

zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# The OpenGL build. `android-sdk-vulkan` renders through Vulkan and needs a driver
# the emulator images in CI do not reliably provide; `android-sdk` is the variant
# MapLibre publishes as the default and the one the Maestro suite has to run on.
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
bdk-android = { group = "org.bitcoindevkit", name = "bdk-android", version.ref = "bdk" }
ldk-node-android = { group = "org.lightningdevkit", name = "ldk-node-android", version.ref = "ldkNode" }

bitcoin-kmp = { group = "fr.acinq.bitcoin", name = "bitcoin-kmp-jvm", version.ref = "bitcoinKmp" }
# secp256k1-kmp ships the API and the JNI implementation as separate artifacts.
# bitcoin-kmp-jvm depends only on the API half, so the native half has to be
# named per target: -jni-android for the app, -jni-jvm for unit tests. Omitting
# either produces a NoClassDefFoundError at first signature, not at build time.
secp256k1-jni-android = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-android", version.ref = "secp256k1Kmp" }
secp256k1-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
# Named explicitly for :core:keystore-probe, which has no Espresso/Compose test dependency to
# pull AndroidJUnitRunner in transitively (BIT-18).
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
