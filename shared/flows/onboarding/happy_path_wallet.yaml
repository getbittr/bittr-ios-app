# Reusable subflow: drives wallet creation from Signup1 through the
# "wallet ready" screen (Signup7), ending at the 12_wallet_ready screenshot.
# Stops before tapping Continue — onboarding/happy_path_signup.yaml picks up
# from there to complete the bittr signup.
#
# Assumes the app is already launched and on Signup1 (no wallet present).
# Called by:
#   - onboarding/fresh_install.yaml (entry point that wipes state first)
#   - features/*.yaml (auto-recovery if a feature test finds itself on Signup1)
#
# Maestro 2.x requires every flow file to have a config section, so appId
# is declared. There's no launchApp at the top — that's the caller's
# responsibility, so this subflow doesn't disturb existing app state when
# called conditionally.

appId: com.bittr.bittr-regtest
---
- assertVisible:
    id: "signup.create.start.createWalletButton"
- takeScreenshot: shared/docs/screenshots/onboarding/01_start

# Before creating the wallet, open the "What is bittr?" article card at the
# bottom of Signup1 → ArticleViewController. Close it via its down button →
# back on Signup1.
- tapOn:
    id: "signup.create.start.articleButton"
- assertVisible:
    id: "article.downButton"
- takeScreenshot: shared/docs/screenshots/onboarding/01b_article
- tapOn:
    id: "article.downButton"
- assertVisible:
    id: "signup.create.start.createWalletButton"

- tapOn:
    id: "signup.create.start.createWalletButton"

- assertVisible:
    id: "signup.create.confirm.topLabel"
- takeScreenshot: shared/docs/screenshots/onboarding/02_confirm_initial
- tapOn:
    id: "signup.create.confirm.switchOne"
- tapOn:
    id: "signup.create.confirm.switchTwo"
- takeScreenshot: shared/docs/screenshots/onboarding/03_confirm_both_on
- tapOn:
    id: "signup.create.confirm.nextButton"

- assertVisible:
    id: "signup.create.mnemonic.mnemonicStack"
- takeScreenshot: shared/docs/screenshots/onboarding/04_mnemonic_top

# Capture all 12 mnemonic words. The verify screen will ask for 3 of them.
- evalScript: ${output.words = {}}
- copyTextFrom:
    id: "signup.create.mnemonic.word1"
- evalScript: ${output.words[1] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word2"
- evalScript: ${output.words[2] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word3"
- evalScript: ${output.words[3] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word4"
- evalScript: ${output.words[4] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word5"
- evalScript: ${output.words[5] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word6"
- evalScript: ${output.words[6] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word7"
- evalScript: ${output.words[7] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word8"
- evalScript: ${output.words[8] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word9"
- evalScript: ${output.words[9] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word10"
- evalScript: ${output.words[10] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word11"
- evalScript: ${output.words[11] = maestro.copiedText}
- copyTextFrom:
    id: "signup.create.mnemonic.word12"
- evalScript: ${output.words[12] = maestro.copiedText}

- scrollUntilVisible:
    element:
      id: "signup.create.mnemonic.nextButton"
- takeScreenshot: shared/docs/screenshots/onboarding/05_mnemonic_bottom
- tapOn:
    id: "signup.create.mnemonic.nextButton"

# Verify screen: labels show three 1-based indices, fields take the matching words.
- assertVisible:
    id: "signup.create.verify.topLabel"
- copyTextFrom:
    id: "signup.create.verify.label1"
- evalScript: ${output.idx1 = parseInt(maestro.copiedText)}
- copyTextFrom:
    id: "signup.create.verify.label2"
- evalScript: ${output.idx2 = parseInt(maestro.copiedText)}
- copyTextFrom:
    id: "signup.create.verify.label3"
- evalScript: ${output.idx3 = parseInt(maestro.copiedText)}
- takeScreenshot: shared/docs/screenshots/onboarding/06_verify_initial

- tapOn:
    id: "signup.create.verify.field1"
- inputText: ${output.words[output.idx1]}
- tapOn:
    id: "signup.create.verify.field2"
- inputText: ${output.words[output.idx2]}
- tapOn:
    id: "signup.create.verify.field3"
- inputText: ${output.words[output.idx3]}
# Dismiss the keyboard — it covers the Next button so a direct tap can't
# reach it. Signup4's textFieldDidEndEditing auto-triggers nextButtonTapped
# once field3 loses focus and all 3 words match.
#
# We tap the topLabel (a UILabel — non-interactive, isUserInteractionEnabled
# = false by default) instead of using `- hideKeyboard`; that tap falls
# through to the VC's backgroundButtonTapped which calls endEditing(true).
# Maestro's hideKeyboard is unreliable across simulator keyboard-mode
# changes (e.g. after toggling the software keyboard via Cmd+K).
- tapOn:
    id: "signup.create.verify.topLabel"
- takeScreenshot: shared/docs/screenshots/onboarding/07_verify_filled

# Set new PIN (Signup5). 4 digits is the minimum.
- assertVisible:
    id: "signup.create.pinSet.topLabel"
- takeScreenshot: shared/docs/screenshots/onboarding/08_pin_set_initial
- tapOn:
    id: "pin.button1"
- tapOn:
    id: "pin.button2"
- tapOn:
    id: "pin.button3"
- tapOn:
    id: "pin.button4"
- takeScreenshot: shared/docs/screenshots/onboarding/09_pin_set_entered
- tapOn:
    id: "pin.confirmButton"

# Confirm PIN (Signup6). Must match the digits above.
- assertVisible:
    id: "signup.create.pinConfirm.topLabel"
- takeScreenshot: shared/docs/screenshots/onboarding/10_pin_confirm_initial
- tapOn:
    id: "pin.button1"
- tapOn:
    id: "pin.button2"
- tapOn:
    id: "pin.button3"
- tapOn:
    id: "pin.button4"
- takeScreenshot: shared/docs/screenshots/onboarding/11_pin_confirm_entered
- tapOn:
    id: "pin.confirmButton"

# Signup6's confirm kicks off wallet startup (BDK + LDK init) and advances to Signup7.
- assertVisible:
    id: "signup.create.ready.topLabelOne"
- takeScreenshot: shared/docs/screenshots/onboarding/12_wallet_ready
