# The smoke flow, on both platforms — verifies that the shared test IDs are
# actually reachable by Maestro. If this passes, the test ID pipeline works end
# to end (JSON → generator → Swift/Kotlin → accessibilityIdentifier/testTag →
# Maestro), which is why it is also the Android CI gate
# (`android/scripts/ci-smoke.sh`).
#
# This flow needs no prerequisite state: it launches with clearState, so it runs
# against a fresh install or a provisioned one.
#
# Per-platform app id comes from ${APP_ID} — the one documented difference
# between the two runs. See shared/flows/README.md, "App id".
#
# clearKeychain below is deliberately NOT guarded per platform: Maestro's
# AndroidDriver implements it as a no-op, so it costs nothing on Android and
# still wipes the iOS keychain, which is where the wallet lives.

appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: ../helpers/wait_for_launch.yaml
- assertVisible:
    id: "signup.create.start.headerLabel"
- assertVisible:
    id: "signup.create.start.createWalletButton"
- assertVisible:
    id: "signup.create.start.restoreButton"
- takeScreenshot: shared/docs/screenshots/signup_create_smoke/01_initial
