# Top-level: wipes app data + keychain and runs the full onboarding from
# scratch. Use this when you want a guaranteed-clean wallet state.
#
# Run: maestro test shared/flows/onboarding/fresh_install.yaml
#
# App injection: by default this onboards whatever ${APP_ID} names. A caller may
# set output.APP_ID before runFlow-ing this file (e.g. helpers/evil_bootstrap.yaml
# sets ${EVIL_APP_ID}) to onboard a different build instead.

appId: ${APP_ID}
---
# Resolve the app under test (default: ${APP_ID}, the app this run targets).
- evalScript: "${output.APP_ID = (output.APP_ID == null ? APP_ID : output.APP_ID)}"
- launchApp:
    appId: ${output.APP_ID}
    clearState: true
    clearKeychain: true
- runFlow: ../helpers/wait_for_launch.yaml
- runFlow: happy_path_wallet.yaml
- runFlow: happy_path_signup.yaml
