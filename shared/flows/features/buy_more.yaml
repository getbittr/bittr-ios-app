# Feature test: top up an existing wallet with another bank transaction.
#
# Prerequisite: buy_incoming.yaml has been run at least once on this app
# install — the lightning channel must already be open. This flow does NOT
# clearState, so the channel survives across runs.
#
# Flow:
#   1. Launch (preserve state). Unlock if locked.
#   2. Once synced, open the Profit screen and remember the starting profit.
#   3. Tap Buy on Home → BuyVC.
#   4. Copy the deposit code.
#   5. Trigger e2e bank-transaction (backend default is €100).
#   6. Wait for the transaction screen.
#   7. Close the transaction screen, then verify the Home profit label and the
#      Profit screen have updated.
#
# No block mining — this is a lightning payment, settles instantly.
#
# Run: maestro test shared/flows/features/buy_more.yaml

appId: com.bittr.bittr-regtest
---
- launchApp

- runFlow:
    when:
      visible:
        id: "unlock.topLabel"
    file: ../helpers/unlock.yaml

# Sanity: must be on Home with the channel already open. If on Signup, the
# user hasn't run buy_incoming yet — fail loudly.
- assertVisible:
    id: "home.headerLabel"
- takeScreenshot: shared/docs/screenshots/buy_more/01_home

# Wait for the post-sign-in wallet sync to finish — the header spinner stops
# in finalizeSync — so the Profit screen reads stable totals.
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 120000

# Open the Profit screen and remember the current profit before this buy. The
# channel is already funded from buy_incoming, so this is non-zero. We compare
# against this value at the end to prove the profit recalculated.
- tapOn:
    id: "home.profitButton"
- assertVisible:
    id: "profits.totalProfitLabel"
- copyTextFrom:
    id: "profits.totalProfitLabel"
- evalScript: ${output.profitBefore = maestro.copiedText}
- takeScreenshot: shared/docs/screenshots/buy_more/02_profit_before
# Close the Profit screen (header down button) → back on Home.
- tapOn:
    id: "header.downButton"
- assertVisible:
    id: "home.headerLabel"

- tapOn:
    id: "home.buyButton"
- assertVisible:
    id: "buy.yourCode"
- takeScreenshot: shared/docs/screenshots/buy_more/03_buy_screen

- copyTextFrom:
    id: "buy.yourCode"
- evalScript: ${output.depositCode = maestro.copiedText}

# Dismiss BuyVC. The incoming-payment alert is added as a subview of
# CoreVC.view (in AlertManager.showAlert), so it'd be hidden behind the
# BuyVC modal if we left it open — Maestro would never find it.
- swipe:
    direction: DOWN
    duration: 800
- assertVisible:
    id: "home.headerLabel"

# Trigger the bank transaction. Backend defaults to €100 when no amount
# is passed. The script captures notification_id and bitcoin_amount from
# the response into output.
- runScript: ../scripts/trigger_bank_transaction.js

# Real APNS push doesn't reach iOS Simulator. Fake it: build the matching
# payout push (lightningPayout with the captured fields — or htlcIncoming if
# the response had no notification_id), then relay via push_server.js.
- runScript: ../scripts/build_payout_push.js
- runScript: ../scripts/push_notification.js

# bittr's HandlePaymentNotification shows an in-app "bittr payout" alert
# with a single OK button. Tap it to start the HTLC processing.
- extendedWaitUntil:
    visible:
      id: "alert.button.0"
    timeout: 30000
- takeScreenshot: shared/docs/screenshots/buy_more/04_payout_alert
- tapOn:
    id: "alert.button.0"

# Lightning payment — settles instantly via the existing channel, no
# block mining required.
- extendedWaitUntil:
    visible:
      id: "transaction.labelAmount"
    timeout: 60000
- takeScreenshot: shared/docs/screenshots/buy_more/05_transaction

# Close the TransactionViewController (header down button). BuyVC was already
# dismissed above (the swipe), so this lands straight back on Home.
- tapOn:
    id: "header.downButton"
- assertVisible:
    id: "home.headerLabel"

# The balance-card profit label should now be shown with the recalculated
# percentage for the new purchase.
- assertVisible:
    id: "home.profitLabel"
- takeScreenshot: shared/docs/screenshots/buy_more/06_home_updated

# Open the Profit screen again and verify it no longer shows the pre-buy profit
# value — i.e. calculateProfit ran and the totals updated for the new purchase.
- tapOn:
    id: "home.profitButton"
- assertVisible:
    id: "profits.totalProfitLabel"
- assertNotVisible:
    text: "${output.profitBefore}"
- takeScreenshot: shared/docs/screenshots/buy_more/07_profit_after

# Close the Profit screen (header down button) → back on Home.
- tapOn:
    id: "header.downButton"
- assertVisible:
    id: "home.headerLabel"

# Open the topmost (newest) transaction in the history table — the buy that
# just came in — in the TransactionViewController.
- assertVisible:
    id: "history.transactionButton0"
- tapOn:
    id: "history.transactionButton0"
- assertVisible:
    id: "transaction.yellowCard"
- takeScreenshot: shared/docs/screenshots/buy_more/08_transaction

# Tap the description to copy it → "Copied" alert (single Okay button) → close it.
- tapOn:
    id: "transaction.descriptionButton"
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_more/09_description_copied
- tapOn:
    id: "alert.button.0"

# Tap the ID to copy it → "Copied" alert (single Okay button) → close it.
- tapOn:
    id: "transaction.copyIdButton"
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_more/10_id_copied
- tapOn:
    id: "alert.button.0"

# Tap the question mark next to "Bittr fee" → info alert → close it.
- tapOn:
    id: "transaction.bittrFeeButton"
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_more/11_bittr_fee_info
- tapOn:
    id: "alert.button.0"

# Tap the question mark next to "Transfer fee" → info alert → close it.
- tapOn:
    id: "transaction.transferFeeButton"
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_more/12_transfer_fee_info
- tapOn:
    id: "alert.button.0"

# Add a note. The note alert is our custom text-field alert; tap the field to
# focus it (tapOn also waits out the alert's slide-up), type the note, tap Save.
- tapOn:
    id: "transaction.addNoteButton"
- tapOn:
    id: "alert.textField"
# Capture the note alert once the keyboard has finished popping up.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shared/docs/screenshots/buy_more/12a_note_alert
- inputText: "buy_more test"
- tapOn:
    text: "Save"

# The note now shows in the transaction's note stack.
- assertVisible:
    id: "transaction.labelNote"
    text: "buy_more test"
- takeScreenshot: shared/docs/screenshots/buy_more/13_note_saved
