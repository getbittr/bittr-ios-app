# Feature test: the bittr signup from the Buy page, exercising the IBAN /
# email validation alerts and the notification-permission gate on the OTP
# screen, then proceeding WITHOUT notifications. A companion to buy_signup.yaml
# that walks the *unhappy* branches and then completes signup via the on-chain
# fallback: declining notifications no longer blocks the user — it registers
# them for on-chain payouts (payment_mode=onchain) and lets them finish.
#
# Prerequisite: a wallet must ALREADY exist on the device, WITHOUT a
# completed bittr signup (e.g. run onboarding/fresh_install_skip_signup.yaml
# first). This test only unlocks — it does NOT auto-create a wallet, because
# wallet creation runs a clearState re-install that would wipe the launchApp
# permissions config below (the notification dialog auto-deny), breaking the
# notification gate. That config makes Maestro auto-deny the iOS notification
# system dialog ("Don't Allow"), so the OTP step drives the real
# denied-notification UX deterministically (see step 7).
#
# Flow:
#   1. Launch (Maestro set to auto-deny the notification dialog) and unlock
#      the existing wallet.
#   2. Wait for Home's header spinner (wallet load) to stop.
#   3. Buy → Check options → Next → "I don't have an IBAN" → the
#      only-IBAN-holders alert → "Go to wallet" returns to Buy.
#   4. Buy → Check options → Next again. Enter the happy-path IBAN minus
#      its last digit + the correct email → Verify → invalid-IBAN alert.
#   5. Fix the IBAN, then drop ".com" from the email → Verify → the
#      "enter your IBAN and email" alert (invalid email).
#   6. Fix the email → Verify → advance to the OTP screen.
#   7. Enter a WRONG code first (111111). Notification permission is
#      undetermined, so: the in-app "Receive notifications" prompt (Alert A)
#      → Okay → the iOS system dialog, which Maestro auto-denies → the
#      denied-notifications gate (Alert B, [Cancel, Continue]). Tap Continue;
#      the code is submitted and check2fa rejects it → incorrect-code alert.
#   8. Re-enter the correct code (123456). Erasing re-arms the auto-submit, so
#      the 6th keystroke auto-triggers again. Permission is now .denied (no
#      in-app prompt / system dialog this round) → straight to the denied gate
#      (Alert B) again → Continue. check2fa accepts 123456.
#   9. Signup proceeds, registering the customer for on-chain payouts. Reuse
#      buy_signup.yaml's clean-path tail — Transfer3 success → Transfer4 info
#      cards → "Open your banking app" modal → back on Buy with the new cell.
#  10. END on the Buy page: assert the new cell rendered AND that the
#      payout-mode switch is OFF (on-chain), reflecting the denied path.
#
# Run: maestro test shared/flows/features/buy_signup_no_notifications.yaml

appId: com.bittr.bittr-regtest
---
# Auto-deny the iOS notification system dialog. This permissions config does
# NOT pre-set the OS permission — the app's notification state stays
# undetermined and the live "Allow / Don't Allow" dialog still appears — it
# tells Maestro's dialog handler which button to tap. With "deny" it taps
# "Don't Allow" (the default is Allow, which is why the dialog kept getting
# granted before). That makes the full denied-notifications UX deterministic
# without us having to tap the un-selectable system dialog ourselves.
- launchApp:
    permissions:
      notifications: deny

# This test REQUIRES an existing wallet (see the header) and only unlocks —
# it deliberately does NOT auto-create one. Wallet creation runs a clearState
# re-install, which wipes the launchApp permissions config above (the
# notification auto-deny), so the notification gate would misbehave.
- runFlow:
    when:
      visible:
        id: "unlock.topLabel"
    file: ../helpers/unlock.yaml

# Home: the header spinner animates while LoadWalletData runs and hides
# (hidesWhenStopped) when it finishes — wait that out before interacting.
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 60000
- assertVisible:
    id: "home.headerLabel"
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/01_home

# Open Buy → empty state (no IBAN entities yet).
- tapOn:
    id: "home.buyButton"
- assertVisible:
    id: "buy.headerLabel"
- tapOn:
    id: "buy.continueButton"

# Signup7 (wallet-ready) hosted by RegisterIban — viewWillAppear hides
# topLabelOne when ibanVC != nil, so anchor on the still-visible Next.
- assertVisible:
    id: "signup.create.ready.continueButton"
- tapOn:
    id: "signup.create.ready.continueButton"

# Transfer1: "I don't have an IBAN". The IBAN field auto-focuses, so the
# skip button at the bottom of the card sits under the keyboard. Dismiss it
# first by tapping the top label — a non-interactive UILabel whose tap falls
# through to the background button's backgroundButtonTapped (endEditing).
- assertVisible:
    id: "signup.bittr.start.ibanTextField"
- tapOn:
    id: "signup.bittr.start.topLabelOne"
- tapOn:
    id: "signup.bittr.start.skipButton"

# Alert: "We're sorry!" / only-IBAN-holders, buttons [Go to wallet, Cancel].
# "Go to wallet" (index 0) dismisses the signup stack back to Buy.
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/02_no_iban_alert
- tapOn:
    id: "alert.button.0"

# Back on Buy — restart the signup.
- assertVisible:
    id: "buy.headerLabel"
- tapOn:
    id: "buy.continueButton"
- assertVisible:
    id: "signup.create.ready.continueButton"
- tapOn:
    id: "signup.create.ready.continueButton"

# Transfer1 again. Enter the happy_path_signup.yaml IBAN MISSING its final
# digit (NL27ABNA0451135725 → ...572) plus the correct email. IBAN field
# auto-focuses, so type straight into it.
- assertVisible:
    id: "signup.bittr.start.ibanTextField"
- inputText: "NL27ABNA045113572"
- tapOn:
    id: "signup.bittr.start.emailButton"
- inputText: "e2ebittr@getbittr.com"

# Verify: both fields are non-empty + the email is valid, so the malformed
# IBAN goes to the backend. Dismiss the keyboard via the top label, then tap
# Verify.
- tapOn:
    id: "signup.bittr.start.topLabelOne"
- tapOn:
    id: "signup.bittr.start.nextButton"

# Async IBAN check → "Oops" invalid-IBAN alert.
- extendedWaitUntil:
    visible:
      id: "alert.button.0"
    timeout: 30000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/03_invalid_iban
- tapOn:
    id: "alert.button.0"

# Fix the IBAN: re-focus the field (tap the visible text field — the IBAN
# button is alpha 0 after first focus), clear it, type the correct value.
- tapOn:
    id: "signup.bittr.start.ibanTextField"
- eraseText: 30
- inputText: "NL27ABNA0451135725"

# Break the email by dropping ".com", then Verify. updateButtonColor only
# enables the button when the email is valid, so an invalid email leaves
# the button disabled and Verify shows the "enter your IBAN and email"
# alert instead of submitting.
- tapOn:
    id: "signup.bittr.start.emailTextField"
- eraseText: 30
- inputText: "e2ebittr@getbittr"
- tapOn:
    id: "signup.bittr.start.topLabelOne"
- tapOn:
    id: "signup.bittr.start.nextButton"
- assertVisible:
    id: "alert.button.0"
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/04_missing_email
- tapOn:
    id: "alert.button.0"

# Fix the email and Verify — both valid now, so the backend accepts and we
# advance to the OTP screen.
- tapOn:
    id: "signup.bittr.start.emailTextField"
- eraseText: 30
- inputText: "e2ebittr@getbittr.com"
- tapOn:
    id: "signup.bittr.start.topLabelOne"
- tapOn:
    id: "signup.bittr.start.nextButton"

# Transfer2 (OTP). The code field auto-focuses and auto-submits once 6
# digits are entered. We enter a WRONG code first (111111) to exercise the
# invalid-code path. The submit path checks notification permission BEFORE
# validating the code: it's undetermined, so the app shows its "Receive
# notifications" prompt, then the iOS system dialog — which Maestro auto-denies
# (the launchApp permissions: notifications: deny config taps "Don't Allow").
- extendedWaitUntil:
    visible:
      id: "signup.bittr.otp.codeTextField"
    timeout: 30000
- inputText: "111111"

# Alert A: the in-app "Receive notifications" prompt. Okay fires the iOS
# system permission dialog, which Maestro auto-denies.
- extendedWaitUntil:
    visible:
      id: "alert.button.0"
    timeout: 20000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/05_notifications_prompt
- tapOn:
    id: "alert.button.0"

# Alert B: after the system dialog is denied, the app shows the
# denied-notifications gate. It offers two buttons — [Cancel (button.0),
# Continue (button.1)]. Tap Continue (button.1) to proceed without
# notifications: the signup submits the entered code (still the WRONG 111111)
# and registers the customer for on-chain payouts rather than being blocked.
- extendedWaitUntil:
    visible:
      id: "alert.button.1"
    timeout: 20000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/06_notification_gate
- tapOn:
    id: "alert.button.1"

# check2fa rejects 111111 → the "Oops" incorrect-code alert (verificationfail,
# single Okay button). Dismiss it and try again with the correct code.
- extendedWaitUntil:
    visible:
      id: "alert.button.0"
    timeout: 30000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/07_wrong_code
- tapOn:
    id: "alert.button.0"

# Re-enter the code with the correct value. Erasing drops the field below 6
# digits, which re-arms the auto-submit, so typing 123456 auto-triggers again
# on the 6th keystroke — same as the first attempt, no manual Confirm needed.
- tapOn:
    id: "signup.bittr.otp.codeTextField"
- eraseText: 6
- inputText: "123456"

# The submit path re-checks notification permission every time. It's now
# .denied (not .notDetermined), so there's NO in-app prompt and NO system
# dialog this round — it goes straight to the denied-notifications gate again.
# Tap Continue (button.1) once more to proceed; this time check2fa accepts
# 123456.
- extendedWaitUntil:
    visible:
      id: "alert.button.1"
    timeout: 20000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/08_notification_gate_retry
- tapOn:
    id: "alert.button.1"

# Proceeding submits 123456 (accepted in test mode), then createBittrAccount
# runs the long async chain. From here the flow mirrors buy_signup.yaml's
# clean-path tail — the only difference is the on-chain payout mode at the end.

# Transfer3: bittr signup success. Generous timeout for the async chain.
- extendedWaitUntil:
    visible:
      id: "signup.bittr.success.topLabelOne"
    timeout: 90000
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/09_bittr_success
- tapOn:
    id: "signup.bittr.success.nextButton"

# Transfer4: 4 explanation cards + "Let's go" at the bottom.
- assertVisible:
    id: "signup.bittr.transferInfo.amountTitle"
- scrollUntilVisible:
    element:
      id: "signup.bittr.transferInfo.nextButton"
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/10_transfer_info
- tapOn:
    id: "signup.bittr.transferInfo.nextButton"

# "Open your banking app" modal — Done dismisses both the alert and the
# RegisterIban modal; Buy reappears underneath with the new cell.
- tapOn:
    id: "alert.button.0"

# Back on Buy — the new IBAN cell renders on the next layout pass after
# parseIbanEntities, so allow a small grace period.
- extendedWaitUntil:
    visible:
      id: "buy.yourCode"
    timeout: 20000
- assertVisible:
    id: "buy.yourEmail"
- assertVisible:
    id: "buy.yourIban"

# Because the user proceeded without notifications, the account was registered
# on-chain, so the payout-mode switch renders OFF (paymentMode == "onchain").
# NOTE: same `checked` caveat as payment_mode.yaml — if your Maestro version
# doesn't read UISwitch state on iOS, drop the `checked:` line and rely on the
# screenshot.
- assertVisible:
    id: "buy.paymentModeSwitch"
    checked: false
- takeScreenshot: shared/docs/screenshots/buy_signup_no_notifications/11_buy_onchain
