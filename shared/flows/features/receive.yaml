# Feature test: receive flow.
# Assumes a wallet exists. If the test launches and finds itself on Signup1
# (state was wiped), it auto-runs the onboarding subflow first so the test
# can be invoked in isolation.
#
# Run: maestro test shared/flows/features/receive.yaml

appId: com.bittr.bittr-regtest
---
# Launch without clearState so existing wallet state is preserved across runs.
- launchApp
- runFlow: ../helpers/wait_for_launch.yaml

# Auto-recover if no wallet exists yet (full onboarding lands on Home).
- runFlow:
    when:
      visible:
        id: "signup.create.start.createWalletButton"
    file: ../onboarding/happy_path_wallet.yaml
- runFlow:
    when:
      visible:
        id: "signup.create.ready.topLabelOne"
    file: ../onboarding/happy_path_signup.yaml

# If the app launched into the PIN unlock screen (existing wallet), enter PIN.
- runFlow:
    when:
      visible:
        id: "unlock.topLabel"
    file: ../helpers/unlock.yaml

# Should be on Home now.
- assertVisible:
    id: "home.headerLabel"
# Wait for the post-sign-in wallet sync to finish — the header spinner stops
# in finalizeSync — so Receive is available before we open it.
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 120000
- takeScreenshot: shared/docs/screenshots/receive/01_home

# Open Receive screen.
- tapOn:
    id: "home.receiveButton"

# ReceiveViewController loads async (lightning availability check, address
# generation, QR rendering). Wait for the address title to settle.
- assertVisible:
    id: "receive.addressTitle"
- assertVisible:
    id: "receive.addressLabel"
- assertVisible:
    id: "receive.qrImageView"
- takeScreenshot: shared/docs/screenshots/receive/02_receive_screen
