# Helper: fund the evil app's ONCHAIN balance (needed for submarine
# onchain→lightning swap tests like evil_boltz_wrong_address.yaml).
#
# The evil app arms EvilBoltz mode `all`, so a lightning→onchain swap can't be
# used to source onchain funds — the tampered reverse response is rejected by
# the very validation under test. Instead, take an onchain receive address from
# the app and mine regtest coinbase straight to it (mine_blocks.js's address
# parameter). 101 blocks so the first coinbase output matures — coinbase is
# only spendable after 100 confirmations. Then resync and land on Home.
#
# Prerequisites: same as evil_bootstrap.yaml.

appId: com.bittr.bittr-evil
---
# Wait for any in-flight sync, then open Receive and surface the onchain address.
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 120000
- tapOn:
    id: "home.receiveButton"
- runFlow:
    file: ../helpers/show_onchain_address.yaml
- copyTextFrom:
    id: "receive.addressLabel"
- evalScript: ${output.mineBlocksAddress = maestro.copiedText}
- takeScreenshot: shared/docs/screenshots/evil_fund_onchain/01_onchain_address

# Mine regtest coinbase straight to that address. 101 blocks so the first
# coinbase output matures (spendable only after 100 confirmations).
- evalScript: ${output.blocksToMine = 101}
- runScript: ../scripts/mine_blocks.js
# Clear the address again: later mine_blocks.js calls (e.g. 6-block
# confirmations) must mine normally, not re-enter the address path (which also
# rejects a <101 block count).
- evalScript: ${output.mineBlocksAddress = null}

# Close Receive → Home, then pull to resync so the wallet picks up the new UTXO.
- tapOn:
    id: "header.downButton"
- assertVisible:
    id: "home.headerLabel"
- swipe:
    direction: DOWN
    duration: 800
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 120000
- takeScreenshot: shared/docs/screenshots/evil_fund_onchain/02_home_funded
