# Helper: provisions the "bittr evil" app (com.bittr.bittr-evil — the
# Debug-EvilBoltz build with the swap-tamper harness armed, see
# ios/bittr/Helpers/EvilBoltz.swift):
#
#   1. Onboard only if needed: launch without clearing state; if a wallet
#      already exists (cold launch shows the PIN screen) just unlock and carry
#      on, otherwise run the clean onboarding — wipe app data + keychain,
#      create wallet, complete bittr signup (onboarding/fresh_install.yaml with
#      output.APP_ID injected).
#   2. Fund the lightning channel with a first e2e bank deposit — mirrors
#      features/buy_incoming.yaml, except the payout push is FAKED via
#      push_server.js targeted at the evil bundle id: the staging backend's
#      real APNs topic only matches com.bittr.bittr-regtest, so a real push
#      would never reach the evil app on the simulator.
#
# Ends on Home with a funded lightning channel, ready for a swap attempt.
#
# Prerequisites: push_server.js running (Terminal A), bittr evil app installed
# once via the `bittr evil` Xcode scheme.
#
# Override the target app by setting output.APP_ID (and optionally
# output.pushBundleId) before runFlow-ing this file — both default to
# com.bittr.bittr-evil.

appId: com.bittr.bittr-evil
---
# Resolve the app under test + the push target (default: the evil app).
- evalScript: "${output.APP_ID = (output.APP_ID == null ? 'com.bittr.bittr-evil' : output.APP_ID)}"
- evalScript: "${output.pushBundleId = (output.pushBundleId == null ? output.APP_ID : output.pushBundleId)}"

# 1) Provision the wallet + bittr account — but only if this install hasn't
#    been onboarded yet. Launch WITHOUT clearing state: a provisioned wallet
#    cold-launches to the PIN unlock screen, a fresh install to the
#    create-wallet start. (fresh_install.yaml below does its own clearing.)
- launchApp:
    appId: ${output.APP_ID}

# Wait briefly for the app to settle on the PIN unlock screen. Optional so a
# fresh install — which never shows it — falls through to onboarding instead.
- extendedWaitUntil:
    visible:
      id: "unlock.topLabel"
    timeout: 15000
    optional: true

# Already provisioned: unlock with the onboarding PIN and carry on (no wipe).
- runFlow:
    when:
      visible:
        id: "unlock.topLabel"
    commands:
      - runFlow: ../helpers/unlock.yaml
      - assertVisible:
          id: "home.headerLabel"

# Fresh install: run the clean onboarding (wipes state + keychain, then
# creates the wallet and completes bittr signup). Ends on Home.
- runFlow:
    when:
      visible:
        id: "signup.create.start.createWalletButton"
    commands:
      - runFlow: ../onboarding/fresh_install.yaml

# 2) Fund the lightning channel — but only if it isn't funded already. Wait for
#    the post-onboarding sync to settle, then peek at the instant (lightning)
#    balance. MoveVC.updateLabels formats it as
#    `String(satoshisLightning).addSpaces() + " sats"` — "0 sats" iff no active
#    channel funds. A reused install that already has a funded channel skips the
#    whole deposit below.
- extendedWaitUntil:
    notVisible:
      id: "home.headerSpinner"
    timeout: 120000
# Tap the balance label, not balanceCardButton: profitButton overlays the visual
# center of the card and a center-tap fires profitButtonTapped (→ ProfitVC). The
# label has userInteractionEnabled = false, so the tap falls through to
# balanceCardButton beneath → HomeToMove. (Same trick remove_wallet.yaml uses.)
- tapOn:
    id: "home.balanceLabel"
- assertVisible:
    id: "move.satsTotal"
- copyTextFrom:
    id: "move.satsInstant"
- evalScript: ${output.lightningBalance = maestro.copiedText}
- tapOn:
    id: "header.downButton"
- assertVisible:
    id: "home.headerLabel"

# Only deposit when lightning is empty (freshly onboarded, or a channel that
# never got funded). An already-funded reused install proceeds straight to the
# swap on its existing channel.
- runFlow:
    when:
      true: ${output.lightningBalance == "0 sats"}
    commands:
      # Open Buy and copy the deposit code. An existing account renders it; a
      # wallet with no account yet (e.g. reinstalled with the Keychain wallet
      # surviving) opens the empty Buy, so complete the signup first. The wait
      # is optional so the empty case doesn't block, and it stops the funded
      # case from racing Buy's async render (which would wrongly look empty).
      - tapOn:
          id: "home.buyButton"
      - extendedWaitUntil:
          visible:
            id: "buy.yourCode"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "buy.yourCode"
          file: ../helpers/complete_bittr_signup.yaml
      - assertVisible:
          id: "buy.yourCode"
      - copyTextFrom:
          id: "buy.yourCode"
      - evalScript: ${output.depositCode = maestro.copiedText}

      # Dismiss BuyVC so alert layers (added to CoreVC.view) are visible to Maestro.
      - swipe:
          direction: DOWN
          duration: 800
      - assertVisible:
          id: "home.headerLabel"

      # Trigger the e2e bank transaction (backend default amount) — the
      # channel-open deposit that funds the lightning channel.
      - runScript: ../scripts/trigger_bank_transaction.js

      # No fake push: a channel-open deposit settles on its own once confirmed.
      # A channel-open has no held HTLC to resume, so faking an htlcIncoming just
      # makes the app call /htlc-interceptor/ready, get `no_held_htlc`, and show
      # two dead-end "incoming payment" alerts.

      # Mine 6 blocks so the channel funding confirms, then pull Home to resync.
      - evalScript: ${output.blocksToMine = 6}
      - runScript: ../scripts/mine_blocks.js
      - swipe:
          direction: DOWN
          duration: 800

      # The completed channel-funding payment opens the transaction detail
      # screen once the sync picks it up — wait for it (proof the channel
      # funded), then close it back to Home.
      - extendedWaitUntil:
          visible:
            id: "transaction.labelAmount"
          timeout: 120000
      - takeScreenshot: shared/docs/screenshots/evil_bootstrap/01_funding_settled
      - tapOn:
          id: "header.downButton"
      - assertVisible:
          id: "home.headerLabel"

      # Relaunch to fully bring the freshly-opened channel up. Right after the
      # open, LDK hasn't re-established it enough to include it as a private
      # routing hint, so a submarine swap's receive-invoice has no route and
      # Boltz reports "could not find route to pay invoice". A restart fixes it;
      # the channel then stays active for the rest of the session (both swaps).
      - launchApp:
          appId: ${output.APP_ID}
      - extendedWaitUntil:
          visible:
            id: "unlock.topLabel"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: "unlock.topLabel"
          commands:
            - runFlow: ../helpers/unlock.yaml
      - assertVisible:
          id: "home.headerLabel"
      - extendedWaitUntil:
          notVisible:
            id: "home.headerSpinner"
          timeout: 120000
