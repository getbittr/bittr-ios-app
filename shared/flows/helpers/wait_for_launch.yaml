# Reusable subflow: waits for the opening animation to finish.
#
# CoreViewController runs the coin/logo animation on every launch, roughly two
# and a half seconds, with animationCover over the top of whichever screen is
# underneath. The screen beneath is fully rendered the whole time, so a gate
# like `assertVisible: unlock.topLabel` passes straight away — but the cover
# swallows the tap that follows, which is how this shows up: a flow that looks
# right and taps into nothing.
#
# The app sets core.launchComplete once the animation is done, so this waits
# for a fact rather than for the screen to stop moving. waitForAnimationToEnd
# is not enough on its own here: the sequence pauses between its stages, and a
# pause looks exactly like the end.
#
# Put this straight after every launchApp, before any gate or tap.
#
# On Android there is no launch animation yet, so `core.launchComplete` is set
# immediately and this subflow returns at once. It is still called rather than
# skipped, for two reasons: the flow does not need rewriting when the animation
# is ported, and — because this file has its own `appId: ${APP_ID}` — calling it
# is what proves `--env` reaches a *subflow's* config block and not just the
# top-level one. (Maestro's `enterEnvScope` copies the live bindings rather than
# replacing them, so it does; this is the flow that demonstrates it on a device.)

appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "core.launchComplete"
    timeout: 15000
