name: Android — build + Maestro smoke

# The Android definition of done is "the Maestro suite passes on Android", so this
# workflow is the gate that claim is measured by. It runs on every push that can
# affect the Android app or the shared flows/test IDs.
#
# Shape, and why:
#   - Build and emulator are separate jobs. The emulator is the slow, flaky-prone
#     part; there is no reason to hold it open while Gradle compiles, and a
#     compile error should fail in ~1 minute rather than after an emulator boot.
#   - No retries anywhere. A flow that needs a retry to pass is a failing flow —
#     see shared/flows/README.md. If the emulator itself is unreliable, that gets
#     reported as a blocker, not papered over with `continue-on-error`.

on:
  push:
    paths:
      - 'android/**'
      - 'shared/flows/**'
      - 'shared/test-ids/**'
      - '.github/workflows/android-maestro.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/flows/**'
      - 'shared/test-ids/**'
      - '.github/workflows/android-maestro.yml'
  workflow_dispatch:

concurrency:
  # Pushes and pull_request updates supersede each other: once a newer commit exists
  # on a ref, the older commit's emulator run is dead weight and should be cancelled.
  #
  # A workflow_dispatch must NEVER be cancelled by the next one, and this is not a
  # nicety — it is the definition of done. BIT-5 closes on three CONSECUTIVE dispatches
  # of the same ref. Under a single shared group every dispatch would cancel the one
  # before it, so dispatching three times would leave two cancellations and one result.
  # On a self-hosted runner it is worse and quieter: one runner serialises jobs, so runs
  # 1 and 2 get cancelled while still QUEUED, having never booted an emulator. The run
  # list shows greys rather than reds, which reads as "I cancelled something" rather
  # than "the harness ate my evidence".
  #
  # Keying manual runs on github.run_id gives each dispatch its own group, so dispatches
  # queue behind each other instead of replacing each other.
  group: android-maestro-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  # Pinned deliberately. The definition of done is three consecutive green runs, which
  # only means something if the three runs used the same tooling — an unpinned installer
  # makes the Maestro version a variable that can change between run 1 and run 3, and
  # "it went red and nothing changed" is the single most expensive kind of CI failure to
  # chase. Maestro does move under this: recent versions route `takeScreenshot` output
  # into the --debug-output bundle rather than writing it CWD-relative.
  #
  # Bump this on purpose, in its own commit, and re-run the three dispatches.
  MAESTRO_VERSION: '2.10.0'
  # Must match android/app/build.gradle.kts: applicationId + debug applicationIdSuffix.
  APP_ID: com.bittr.android.regtest

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Lint this workflow
        # A workflow is the one file in the repo that nothing else type-checks, and its
        # mistakes are only discovered by running it — which here costs an emulator boot.
        # actionlint validates ${{ }} expressions against the real context types and runs
        # shellcheck over every `run:` block. Pinned so the check itself cannot change
        # under a run; runs first because it costs about two seconds.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
        env:
          ACTIONLINT_VERSION: '1.7.12'

      - name: Check a dispatch cannot cancel the previous dispatch
        # This one is invisible to actionlint — the bad version is perfectly valid YAML
        # and a perfectly sensible concurrency rule; it is only wrong because of what
        # BIT-5 measures. Keying manual runs on the ref alone means dispatch N cancels
        # dispatch N-1, so "three consecutive green runs" silently becomes one result and
        # two cancellations. On a single self-hosted runner the cancelled runs never even
        # boot an emulator, so they show as greys rather than reds and are easy to miss.
        #
        # Guards the property, not the exact string, so the group can still be rewritten.
        # No PyYAML: shared/test-ids/*.py deliberately parse with `re` so the checks run
        # on any python3 without a pip step, and this stays consistent with that.
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          text = Path(".github/workflows/android-maestro.yml").read_text()
          # The concurrency block: from the top-level key to the next top-level key.
          match = re.search(r"^concurrency:\n(.*?)(?=^\S)", text, re.MULTILINE | re.DOTALL)
          if not match:
              sys.exit("No top-level `concurrency:` block found — this guard is now checking nothing.")
          block = match.group(1)

          cancels = re.search(r"^\s+cancel-in-progress:\s*true\s*$", block, re.MULTILINE)
          group = re.search(r"^\s+group:\s*(.+?)\s*$", block, re.MULTILINE)
          if not group:
              sys.exit("`concurrency.group` not found inside the concurrency block.")

          if cancels and "github.run_id" not in group.group(1):
              sys.exit(
                  "concurrency.group must vary by github.run_id while cancel-in-progress is "
                  "true, or each manual dispatch cancels the one before it and the "
                  "three-consecutive-runs definition of done cannot be measured.\n"
                  f"  group = {group.group(1)}\n"
                  "See android/docs/self-hosted-runner.md, 'Why three dispatches in a row is safe'."
              )
          print(f"concurrency group is dispatch-safe: {group.group(1)}")
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Check every flow ID is registered
        # A flow selecting an ID that is in no registry entry fails at run time
        # with "element not found" — indistinguishable from a missing testTag in
        # the app, and it costs an emulator boot to find out. Fail here instead.
        run: python3 shared/test-ids/check_flow_ids.py

      - name: Check generated test IDs are in sync
        # The generated TestIDs.swift/.kt are committed for diff visibility. If
        # someone edits test-ids.json without regenerating, iOS and Android drift
        # apart silently and the shared flows start failing on one platform only.
        # Cheapest possible place to catch it.
        #
        # Android is a hard failure. iOS is advisory only: the Android port may
        # not change iOS sources without sign-off (BIT-7 deliverable 2), so the
        # Swift file is allowed to lag test-ids.json until that lands. The notice
        # keeps the pending diff visible rather than silent.
        run: |
          python3 shared/test-ids/build.py --platform android
          git diff --exit-code -- android/core/common/src/main/kotlin/com/bittr/android/core/common/TestIDs.kt \
            || { echo "::error::Generated Android test IDs are stale. Run ./shared/test-ids/build.py --platform android and commit the result."; exit 1; }
          python3 shared/test-ids/build.py --platform ios
          git diff --quiet -- ios/bittr/Helpers/TestIDs.swift \
            || echo "::notice::TestIDs.swift is behind test-ids.json. Regenerating it is an iOS change and needs sign-off."
          git checkout -- ios/bittr/Helpers/TestIDs.swift

      - name: Unit tests
        working-directory: android
        # `test`, not `testDebugUnitTest`. The pure-Kotlin modules (:core:common,
        # :core:wallet, :core:wallet-stub) have no Android variants, so their test
        # task is plain `test` — `testDebugUnitTest` reports NO-SOURCE for them and
        # goes green having run nothing. That includes the test-tag checks below.
        #
        # This step is also where the emulator's biggest failure mode is caught,
        # before an emulator is ever booted. BiometricUnlockFlagTest and
        # BiometricApiGuardTest enforce that the regtest APK cannot show a
        # BiometricPrompt at unlock: 296 of the 329 takeScreenshot steps sit behind
        # a PIN entry, so a prompt in front of the PIN pad fails ~90% of the suite
        # at once and early enough to bury its own cause. ScreenshotBlockingGuardTest
        # covers the quieter twin — an app-wide FLAG_SECURE makes every screenshot a
        # black frame without failing a single flow.
        #
        # None of this depends on the emulator image's fingerprint enrolment. It is
        # a property of the APK, so it holds on any runner.
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  maestro:
    name: Maestro smoke (emulator)
    # The emulator job is the one with a hardware requirement (KVM), so it is the
    # one that gets to move hosts. Set the repository variable
    # ANDROID_EMULATOR_RUNNER to a self-hosted label to move it; unset, it stays on
    # GitHub-hosted runners, which have KVM and need no provisioning.
    #
    # The variable holds a JSON array, and fromJSON is load-bearing: runs-on matches
    # a *list* of labels, so a bare "self-hosted,linux,x64" string becomes one label
    # that matches no runner — and the symptom is a job queued forever, not an error.
    #
    # Prerequisites for a self-hosted host are in android/docs/self-hosted-runner.md.
    # The preflight step below fails fast and points there rather than letting a
    # misprovisioned host burn the 30-minute timeout.
    runs-on: ${{ fromJSON(vars.ANDROID_EMULATOR_RUNNER || '["ubuntu-latest"]') }}
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mark job start
        # BIT-5 asks for the wall-clock number, and until this step the workflow
        # produced no number at all — you had to read the durations off the run
        # page and add them up by eye, once per run, three times. Worse, the
        # emulator-runner step is a single timed unit covering AVD boot, install
        # and the flow together, so the figure it shows answers "how long does
        # CI take" and not "how long does the flow take", which are different
        # questions with answers minutes apart.
        #
        # Recording the start here lets the run step below decompose it into a
        # table in the job summary, so each run states its own number and three
        # consecutive runs can be compared without anyone doing arithmetic.
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Enable KVM
        # GitHub-hosted Linux runners expose /dev/kvm but not to non-root users by
        # default. Without this the emulator falls back to software rendering and
        # goes from "about a minute to boot" to "does not finish".
        #
        # Deliberately NOT run on self-hosted hosts. There it is provisioning, not a
        # build step: the rule belongs in the host's image (it needs passwordless
        # sudo to apply, and re-applying it on every job is a persistent change made
        # by untrusted-ish job code). See android/docs/self-hosted-runner.md.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preflight — hardware acceleration is actually available
        # Without KVM the emulator does not fail, it crawls: boot goes from ~1
        # minute to past any sane timeout, and the job dies 30 minutes later with
        # "Timeout waiting for emulator to boot" — which reads like a flaky
        # emulator rather than a misconfigured host. Six seconds here saves that.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on runner '${{ runner.name }}'. The emulator needs hardware acceleration; without it this job times out rather than failing. If this is a VM, nested virtualisation must be enabled on the hypervisor. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not read/write for user '$(id -un)'. Add the runner user to the 'kvm' group. See android/docs/self-hosted-runner.md."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM OK on ${{ runner.environment }} runner '${{ runner.name }}' as $(id -un)."

      - name: Preflight — ANDROID_HOME is set
        # android-emulator-runner installs the SDK components itself, but it resolves
        # them against $ANDROID_HOME. GitHub-hosted images set it; a freshly registered
        # self-hosted runner does not. Unset, the action expands the path to the literal
        # string "undefined/cmdline-tools" and the failure surfaces much later as a
        # confusing sdkmanager error rather than a missing variable.
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on runner '${{ runner.name }}'. android-emulator-runner installs the SDK itself but needs somewhere to put it. Export ANDROID_HOME (e.g. /opt/android-sdk, writable by the runner user) in the runner service environment. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Maestro
        # MAESTRO_VERSION is read by the installer (unset would fetch releases/latest).
        # The version is echoed so each run's log records which Maestro produced its
        # result — without that, comparing three "consecutive" runs assumes something
        # nobody actually checked.
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="${MAESTRO_VERSION}" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-aosp-atd-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted"

      - name: Run Maestro smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # aosp_atd = Automated Test Device: a stripped AOSP image built for CI.
          # No Play Services, no Google apps, materially faster to boot and less
          # prone to a background service waking up mid-flow. The app has no Play
          # Services dependency yet; when FCM lands, this must move to a
          # google_apis image and the boot-time number below gets re-measured.
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail

            # The emulator is booted by the time this script starts, so this is
            # the first moment the job can observe how long booting took.
            emulator_ready=$(date +%s)

            adb install -r apk/*.apk
            installed=$(date +%s)

            # Video of the run, kept when the flow fails.
            #
            # --debug-output already gives a screenshot and a view hierarchy dump at
            # the moment of failure, and for a missing test tag that is the whole
            # answer. It is the wrong instrument for anything transient: a splash
            # that never dismisses, a dialog that steals focus for 400ms, an
            # animation still settling. Those leave a final frame that looks
            # unremarkable, and the hierarchy dump agrees with it.
            #
            # `adb emu screenrecord`, not `adb shell screenrecord`. The console
            # command records the emulator's display pipeline straight to a file on
            # the HOST: no /sdcard space, no adb pull, and no SIGINT-to-finalise
            # dance (device-side screenrecord writes an unplayable file if the
            # process is killed any other way). It also works headless under
            # swiftshader, which is the only configuration this job runs in.
            #
            # Every recorder call below is non-fatal by construction. A diagnostic
            # must not be able to fail the thing it is diagnosing — the worst case
            # here is "no video, plus a warning saying so", which is exactly the
            # behaviour that existed before this block.
            mkdir -p maestro-video
            video="$PWD/maestro-video/scaffold_smoke.webm"
            recording=no
            if rec_out=$(adb emu screenrecord start "$video" 2>&1) \
               && ! printf '%s' "$rec_out" | grep -qi '^KO'; then
              recording=yes
            else
              echo "::warning::Could not start emulator screen recording (${rec_out:-no output}). The flow still runs; if it fails there will be no video, only maestro-debug/."
            fi

            # The flow's exit status is the job's result, but the recorder has to be
            # stopped on the failing path too — that is the path the video exists for.
            set +e
            flow_start=$(date +%s)
            maestro test \
              --debug-output maestro-debug \
              --format junit \
              --output maestro-report.xml \
              shared/flows/android/scaffold_smoke.yaml
            status=$?
            flow_end=$(date +%s)
            set -e

            if [ "$recording" = yes ]; then
              adb emu screenrecord stop \
                || echo "::warning::Screen recording did not stop cleanly; the video may be truncated."
            fi

            if [ "$status" -eq 0 ]; then
              # Green runs keep the junit report and the flow's own screenshot. The
              # definition of done is three consecutive green dispatches, and paying
              # an upload for a video nobody opens on all three is pure overhead.
              rm -f "$video"
            elif [ ! -s "$video" ]; then
              echo "::warning::Flow failed and no video was captured (${video##*/} missing or empty). Use maestro-debug/ for the screenshot and view hierarchy."
            fi

            # The wall-clock number BIT-5 asks to be told, written where it is read
            # without opening a log. Emitted on the failing path too: "it went red
            # after 28 minutes" and "it went red after 40 seconds" are different
            # failures, and the timeout case is only legible with the number.
            #
            # Boot dominates and that is the point of splitting it out — the flow
            # itself is a launch and three assertions, so if anyone ever finds this
            # job too slow to wait for, the answer is in the boot row, not the flow
            # row, and no amount of flow tuning will touch it.
            # Every expansion here is defaulted and the whole block is non-fatal,
            # for the same reason the recorder above is: this runs AFTER the flow
            # has already produced its verdict, so a fault in the reporting must
            # not be able to change it. Under `set -euo pipefail` an unset
            # JOB_START_EPOCH — one skipped step, one typo'd variable — would
            # abort here and turn a green flow into a red job, which is the most
            # confusing failure this workflow could possibly emit.
            if [ "$status" -eq 0 ]; then result="green"; else result="RED (exit $status)"; fi
            job_start="${JOB_START_EPOCH:-0}"
            if [ "$job_start" = 0 ]; then
              boot="unknown"; total="unknown"
            else
              boot=$((emulator_ready - job_start)); total=$(($(date +%s) - job_start))
            fi
            {
              echo "### Maestro smoke — wall clock"
              echo
              echo "| stage | seconds |"
              echo "|---|---:|"
              echo "| emulator boot + SDK setup | $boot |"
              echo "| APK install | $((installed - emulator_ready)) |"
              echo "| **flow** (\`scaffold_smoke.yaml\`) | **$((flow_end - flow_start))** |"
              echo "| emulator job, total | $total |"
              echo
              echo "Result: **$result** · Maestro \`${MAESTRO_VERSION:-unpinned}\` · runner \`${RUNNER_ENVIRONMENT:-unknown}\`"
              echo
              echo "The \`build\` job runs before this one; its duration is on the run page."
              echo "BIT-5 closes on three consecutive green dispatches — compare the flow row across all three."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || echo "::warning::Could not write the wall-clock summary. The flow's own result is unaffected."

            exit "$status"

      - name: Upload Maestro artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          # --debug-output carries the screenshot-on-failure, the view hierarchy
          # dump at the point of failure, and the maestro log. The hierarchy dump
          # is the one that actually explains "element not found".
          #
          # maestro-video/ is present only when the flow failed — the run step
          # deletes it on green. It covers what a final-frame screenshot cannot:
          # anything that was transient by the time the capture happened.
          path: |
            maestro-debug/**
            maestro-video/**
            maestro-report.xml
            shared/docs/screenshots/android_scaffold_smoke/**
          retention-days: 14
          if-no-files-found: warn
