name: Android — build + Maestro smoke

# The Android definition of done is "the Maestro suite passes on Android", so this
# workflow is the gate that claim is measured by. It runs on every push that can
# affect the Android app or the shared flows/test IDs.
#
# Shape, and why:
#   - Build and emulator are separate jobs. The emulator is the slow, flaky-prone
#     part; there is no reason to hold it open while Gradle compiles, and a
#     compile error should fail in ~1 minute rather than after an emulator boot.
#   - No retries anywhere. A flow that needs a retry to pass is a failing flow —
#     see shared/flows/README.md. If the emulator itself is unreliable, that gets
#     reported as a blocker, not papered over with `continue-on-error`.

on:
  push:
    paths:
      - 'android/**'
      - 'shared/flows/**'
      - 'shared/test-ids/**'
      - 'shared/strings/**'
      - 'ios/bittr/Language.swift'
      - '.github/workflows/android-maestro.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/flows/**'
      - 'shared/test-ids/**'
      - 'shared/strings/**'
      - 'ios/bittr/Language.swift'
      - '.github/workflows/android-maestro.yml'
  workflow_dispatch:

concurrency:
  # Every run gets its own group, so no run of this workflow can ever cancel another.
  # That is a deliberate trade against the usual advice, and it is worth stating why.
  #
  # A workflow_dispatch must NEVER be cancelled by the next one, and this is not a
  # nicety — it is the definition of done. BIT-5 closes on three CONSECUTIVE runs of
  # the same ref. Under a single shared group every run would cancel the one before it,
  # so running three times would leave two cancellations and one result. On a
  # self-hosted runner it is worse and quieter: one runner serialises jobs, so runs 1
  # and 2 get cancelled while still QUEUED, having never booted an emulator. The run
  # list shows greys rather than reds, which reads as "I cancelled something" rather
  # than "the harness ate my evidence".
  #
  # The obvious rule — key on the ref and let a newer commit supersede an older one —
  # covers dispatches by keying manual runs on github.run_id. That was the original
  # shape here, and it is not enough, because THREE PUSHES IN A ROW TO ONE BRANCH IS
  # THE SAME SCENARIO. Until this workflow is on the default branch there is no
  # workflow_dispatch button, so pushing is the only way to produce the three runs;
  # a ref-keyed group turns the first two into cancellations.
  #
  # Note what supersede-cancellation was actually buying. It only ever fires when two
  # runs of the same ref overlap — i.e. exactly and only in the case above. There is no
  # third scenario where it saves minutes without also being able to eat evidence, so
  # keying on github.sha does not so much weaken the rule as retire it. The cost is real
  # and bounded: push twice in quick succession while iterating and you now pay for two
  # emulator runs (~15 runner-minutes) instead of one. Evidence beats minutes here.
  #
  # cancel-in-progress stays true and is now near-inert by construction: it can only
  # cancel a second run of an identical SHA on an identical ref, which is a re-run
  # racing itself and is the one case where cancelling is unambiguously right.
  group: android-maestro-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: true

env:
  # Two JDKs, and the order is load-bearing: `setup-java` points JAVA_HOME at the
  # LAST one listed, so Gradle itself runs on 21 while 17 stays installed for the
  # four pure-Kotlin modules that ask for `jvmToolchain(17)`.
  #
  # It was '17' alone until BIT-59 put this module's Robolectric tests in front of
  # a CI runner. Robolectric 4.16.1 declares a minimum JDK per SDK level — read
  # off org.robolectric.plugins.DefaultSdkProvider rather than from memory:
  #
  #   SDK 33 -> Java 9    SDK 34 -> Java 17
  #   SDK 35 -> Java 17   SDK 36 -> Java 21
  #
  # and :core:wallet-ldk pins @Config(sdk = [26, 34, 36]) on the three classes
  # that prove BIT-8 rule 3 and BIT-20 rules 3 and 5. On JDK 17 those three die at
  # initialisation — "Failed to create a Robolectric sandbox: Android SDK 36
  # requires Java 21 (have Java 17)" — before a single assertion runs, and every
  # emulator job in this workflow `needs: build`, so the failure takes the whole
  # run with it.
  #
  # The alternative was to move the pin down to 35. Rejected: RobolectricSdkPinGuardTest
  # explains why that module states the API levels its claims hold at, and 36 is
  # the level :app targets. Lowering a security claim's coverage to fit the CI
  # JDK is the wrong end to fix this from — especially since every developer
  # machine here already runs Gradle on 21, which is exactly why this was green
  # locally and red in CI.
  #
  # Bytecode targets are untouched: sourceCompatibility/jvmTarget stay at 17
  # everywhere. This changes the JVM the build and the tests RUN on, not what
  # they compile to.
  JAVA_VERSION: |
    17
    21
  # Pinned deliberately. The definition of done is three consecutive green runs, which
  # only means something if the three runs used the same tooling — an unpinned installer
  # makes the Maestro version a variable that can change between run 1 and run 3, and
  # "it went red and nothing changed" is the single most expensive kind of CI failure to
  # chase. Maestro does move under this: recent versions route `takeScreenshot` output
  # into the --debug-output bundle rather than writing it CWD-relative.
  #
  # Bump this on purpose, in its own commit, and re-run the three runs.
  MAESTRO_VERSION: '2.10.0'
  # Must match android/app/build.gradle.kts: applicationId + debug applicationIdSuffix.
  #
  # Load-bearing, not informational. android/scripts/ci-smoke.sh passes this to
  # Maestro as `--env APP_ID`, and every shared flow reads its `appId:` from it
  # (BIT-102) — so this single line is what makes the iOS flow files run here.
  # The emulator step fails fast if it is unset rather than discovering it as a
  # failed launch after a boot.
  APP_ID: com.bittr.android.regtest

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Lint this workflow
        # A workflow is the one file in the repo that nothing else type-checks, and its
        # mistakes are only discovered by running it — which here costs an emulator boot.
        # actionlint validates ${{ }} expressions against the real context types and runs
        # shellcheck over every `run:` block. Pinned so the check itself cannot change
        # under a run; runs first because it costs about two seconds.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
        env:
          ACTIONLINT_VERSION: '1.7.12'

      - name: Check the emulator script is POSIX sh
        # The one blind spot in the step above. actionlint shellchecks every `run:`
        # block, but the emulator's commands are a `script:` INPUT to a third-party
        # action, so they are an opaque string to it — and that is exactly where the
        # first real CI run of this workflow died, on its own first line, after a full
        # emulator boot: "/usr/bin/sh: 1: set: Illegal option -o pipefail".
        #
        # Cheap here, ~20 minutes there. Deliberately in the build job so it gates the
        # emulator job rather than running inside it.
        run: bash android/scripts/check-action-scripts.sh

      - name: Check no run of this workflow can cancel another
        # This one is invisible to actionlint — the bad version is perfectly valid YAML
        # and a perfectly sensible concurrency rule; it is only wrong because of what
        # BIT-5 measures. Keying on the ref alone means run N cancels run N-1, so "three
        # consecutive green runs" silently becomes one result and two cancellations. On a
        # single self-hosted runner the cancelled runs never even boot an emulator, so
        # they show as greys rather than reds and are easy to miss.
        #
        # This originally checked github.run_id only, which covers workflow_dispatch and
        # left the push path — the only path available before the workflow reaches the
        # default branch — wide open. Both event kinds are checked now.
        #
        # Guards the property, not the exact string, so the group can still be rewritten.
        # No PyYAML: shared/test-ids/*.py deliberately parse with `re` so the checks run
        # on any python3 without a pip step, and this stays consistent with that.
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          text = Path(".github/workflows/android-maestro.yml").read_text()
          # The concurrency block: from the top-level key to the next top-level key.
          match = re.search(r"^concurrency:\n(.*?)(?=^\S)", text, re.MULTILINE | re.DOTALL)
          if not match:
              sys.exit("No top-level `concurrency:` block found — this guard is now checking nothing.")
          block = match.group(1)

          cancels = re.search(r"^\s+cancel-in-progress:\s*true\s*$", block, re.MULTILINE)
          group = re.search(r"^\s+group:\s*(.+?)\s*$", block, re.MULTILINE)
          if not group:
              sys.exit("`concurrency.group` not found inside the concurrency block.")
          expr = group.group(1)

          # Each entry: the run-distinguishing context, and the route it protects.
          required = [
              ("github.run_id", "workflow_dispatch — dispatch N would cancel dispatch N-1"),
              ("github.sha", "push — three pushes to one branch would leave two cancellations"),
          ]
          missing = [(ctx, why) for ctx, why in required if ctx not in expr]
          if cancels and missing:
              sys.exit(
                  "concurrency.group must vary per run while cancel-in-progress is true, or "
                  "BIT-5's three-consecutive-green-runs definition of done cannot be measured.\n"
                  f"  group = {expr}\n"
                  + "".join(f"  missing {ctx}: {why}\n" for ctx, why in missing)
                  + "See android/docs/self-hosted-runner.md, 'Why three runs in a row is safe'."
              )
          print(f"concurrency group cannot cancel a sibling run: {expr}")
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Test the CI-results reader
        # ci-runs.py is the gate that answers "are the last N runs green", which
        # is how this issue's definition of done is checked. It shipped untested
        # and its first contact with a repo that had a run in flight reported NOT
        # GREEN — `conclusion` is null until a run finishes, and null != success.
        # A gate that misreports is worse than no gate, so it gets tests, and
        # they run here. No network: the tests stub the transport.
        run: python3 android/scripts/test_ci_runs.py

      - name: Test the K1 harness
        # K1 (BIT-18) is the measurement BIT-8 rule 2 rests on: does a
        # non-auth-bound Keystore key survive a lock-screen change. Its result
        # table can only be produced by android/scripts/k1-lockscreen-matrix.sh
        # against real devices, which this workflow cannot do — but the driver
        # that decides whether a row reads PASS is plain bash, and it can be
        # tested here.
        #
        # That is the part worth gating. K1's failure mode is not a red row, it
        # is a green row from a run where the mutation silently did not happen,
        # quoted afterwards in a security statement. test-k1-driver.sh runs the
        # real driver against a stub adb and asserts it comes out ERROR for each
        # shape of that: a mutation command that exits 0 and changes nothing, a
        # mutation that lands on the wrong credential, an open phase with no
        # verdict line. None of these suites needs a device or the SDK.
        #
        # test-k1-annotation.sh covers how the table gets OUT. On this repository
        # job logs (403), artefact zips (401) and the job summary (not in the API)
        # are all unreadable without admin, so the annotation k1-ci.sh emits is
        # the only copy most readers can get — and an unescaped newline truncates
        # it to one line without erroring. Same shape of silent defect as a row
        # that measured nothing.
        run: |
          set -euo pipefail
          bash android/scripts/test-k1-verdict.sh
          bash android/scripts/test-k1-annotation.sh
          python3 android/scripts/test_k1_result.py
          bash android/scripts/test-k1-driver.sh
      - name: Test the instrumented-results reader
        # Same argument, one job over. check-instrumented-results.py is what decides
        # whether the `instrumented` job's green means anything, and its whole
        # purpose is to refuse a green run that proved nothing — so a bug in it does
        # not look like a bug, it looks like a pass. No emulator needed: the seam is
        # a results directory, so the fixtures are XML in a temp dir and this runs
        # here in seconds rather than only after an AVD has booted.
        run: python3 android/scripts/test_check_instrumented_results.py

      - name: Test the wallet instrumented-results gate
        # BIT-59, and the same argument again with more riding on it. This gate
        # decides whether the `wallet-instrumented` job's green means anything,
        # and what a false green there would close is the one wallet claim
        # wallet-security-properties.md §4 records as unproven — a claim BIT-20
        # rule 5 makes a PRECONDITION of `match -> keep`, not a follow-up. So a
        # bug here does not leave that claim unproven-and-known; it converts it
        # into proven-and-wrong.
        #
        # It also covers the failure specific to this suite spanning two modules:
        # :core:wallet-ldk running while :app does not, which leaves the backup
        # claim unchecked behind a job that stayed green.
        run: python3 android/scripts/test_check_wallet_instrumented_results.py

      - name: Test the unit-test failure reporter
        # report-test-failures.py is the only thing that says WHICH unit test
        # broke in a form anyone outside this runner can read — see its header,
        # and the step that invokes it below. A diagnosis channel that is quietly
        # broken does not look broken: it looks like a failure with nothing to
        # say, which is the exact state it exists to end. It only ever runs on an
        # already-red job, so nothing else would ever catch a bug in it.
        run: python3 android/scripts/test_report_test_failures.py

      - name: Test the backup-set inspector
        # check-backup-set.sh is the only check in the repo that reads a real
        # backup SET rather than `bmgr`'s report of one, and it is what would
        # raise the BIT-20 §5.3 halt. Its failure mode is not a crash: it is
        # saying "no wallet marker" when it never looked, which reads exactly
        # like evidence. The first draft did precisely that — grepped three
        # hard-coded paths and treated "none of them exist on this image" as
        # clean — and `outcome_3_no_directories` in this suite pins it.
        #
        # Runs here rather than in the emulator job because the seam is `adb`:
        # with a stub on PATH every branch is reachable in milliseconds, where in
        # the emulator job only the branch that device happens to take ever runs.
        run: bash android/scripts/test_check_backup_set.sh

      - name: Pin the wallet job's package name to what Gradle installs
        # BIT-108 put the device-transfer backup on the HOST, where the package
        # is a string handed to `adb` — `pm list packages`, /data/data/<pkg>/,
        # `bmgr backupnow <pkg>`. Nothing compiles that string against the app.
        #
        # The first version of that phase used the `namespace`,
        # com.bittr.android, rather than what is installed: applicationId plus
        # the debug `applicationIdSuffix`, com.bittr.android.regtest. The phase
        # then found no such package, reported the app as uninstalled, skipped
        # the backup, and left check-backup-set.sh grepping a set nothing wrote
        # — which is a warning at exit 0. A run that measured nothing, reading
        # as a run that looked and found nothing.
        #
        # Here rather than in the emulator job for the usual reason: the drift
        # is visible in three files with no device involved, and catching it
        # after a boot costs a run to learn something a grep knew.
        run: bash android/scripts/test_ci_wallet_host_phase.sh

      - name: Check every flow ID is registered
        # A flow selecting an ID that is in no registry entry fails at run time
        # with "element not found" — indistinguishable from a missing testTag in
        # the app, and it costs an emulator boot to find out. Fail here instead.
        run: python3 shared/test-ids/check_flow_ids.py

      - name: Check the suite's copy dependencies still hold
        # The flows assert *which* alert is on screen by matching its wording —
        # alert.button._index and alert.textField are the only ids on that surface.
        # 39 matchers across 24 flows depend on 37 keys in Language.swift plus 7
        # strings hardcoded outside it. The *Language.swift -> shared/strings/ move
        # touches every one of them, and a rewording in transit fails silently (a
        # copy change is not a behaviour change, so nobody looks for a test result)
        # and on both platforms at once (both apps will read the same source).
        #
        # The self-test runs first: this guard is the only thing standing between
        # that migration and those 24 flows, so "it passed" has to mean something.
        # Two of its cases are the migration itself — the same lock re-checked
        # against a generated en.json, verbatim and reworded.
        run: |
          python3 shared/strings/test_check_flow_copy.py
          python3 shared/strings/check_flow_copy.py
      - name: Check no flow hardcodes an app id
        # The twin of the check above, for the other thing a flow names that can
        # be wrong for one platform only. A shared flow that says
        # `appId: com.bittr.bittr-regtest` parses fine and runs fine on iOS; on
        # Android it boots an emulator, installs the APK and then fails to launch
        # a package that was never installed. Seconds here, ~20 minutes there.
        run: python3 shared/flows/check_app_ids.py

      - name: Check generated test IDs are in sync
        # The generated TestIDs.swift/.kt are committed for diff visibility. If
        # someone edits test-ids.json without regenerating, iOS and Android drift
        # apart silently and the shared flows start failing on one platform only.
        # Cheapest possible place to catch it.
        #
        # Android is a hard failure. iOS is advisory only: the Android port may
        # not change iOS sources without sign-off (BIT-7 deliverable 2), so the
        # Swift file is allowed to lag test-ids.json until that lands. The notice
        # keeps the pending diff visible rather than silent.
        run: |
          python3 shared/test-ids/build.py --platform android
          git diff --exit-code -- android/core/common/src/main/kotlin/com/bittr/android/core/common/TestIDs.kt \
            || { echo "::error::Generated Android test IDs are stale. Run ./shared/test-ids/build.py --platform android and commit the result."; exit 1; }
          python3 shared/test-ids/build.py --platform ios
          git diff --quiet -- ios/bittr/Helpers/TestIDs.swift \
            || echo "::notice::TestIDs.swift is behind test-ids.json. Regenerating it is an iOS change and needs sign-off."
          git checkout -- ios/bittr/Helpers/TestIDs.swift

      - name: No WebView bridge in the non-Kotlin sources
        # The Kotlin half of this ban is JavascriptInterfaceGuardTest, which runs
        # in the step below and reads code with comments and string literals
        # stripped — so a file may explain why the API is banned and may not call
        # it. Nothing reads the Java, XML or manifest sources at all, and a bridge
        # can be installed from a Java file or an object declared in XML, so they
        # get a plain grep. There is no prose in them to trip over.
        #
        # `--exclude-dir=build` is load-bearing, not tidiness: Gradle writes JUnit
        # results as XML, so a local run leaves TEST-JavascriptInterfaceGuardTest.xml
        # on disk containing every banned name in its own failure message. Grepping
        # it back is the same mistake the Kotlin guards used to make — reading
        # something that talks about the ban and calling it a violation.
        #
        # `|| true` on grep -r: it exits 1 when it finds nothing, which is the
        # case this step is hoping for.
        run: |
          set -euo pipefail
          hits=$(grep -rn --include='*.java' --include='*.xml' \
                   --exclude-dir=build --exclude-dir=.gradle \
                   -e 'addJavascriptInterface' -e 'JavascriptInterface' \
                   android/ || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::addJavascriptInterface is banned (BIT-33 R-1). It is the one WebView bridge API with no origin or frame scoping, and S-36 loads an arbitrary third-party URL from BTCMap place data. See JavascriptInterfaceGuardTest."
            exit 1
          fi

      - name: Unit tests
        working-directory: android
        # `test`, not `testDebugUnitTest`. The pure-Kotlin modules (:core:common,
        # :core:wallet, :core:wallet-stub) have no Android variants, so their test
        # task is plain `test` — `testDebugUnitTest` reports NO-SOURCE for them and
        # goes green having run nothing. That includes the test-tag checks below.
        #
        # This step is also where the emulator's biggest failure mode is caught,
        # before an emulator is ever booted. BiometricUnlockFlagTest and
        # BiometricApiGuardTest enforce that the regtest APK cannot show a
        # BiometricPrompt at unlock: 296 of the 329 takeScreenshot steps sit behind
        # a PIN entry, so a prompt in front of the PIN pad fails ~90% of the suite
        # at once and early enough to bury its own cause. ScreenshotBlockingGuardTest
        # covers the quieter twin — an app-wide FLAG_SECURE makes every screenshot a
        # black frame without failing a single flow.
        #
        # None of this depends on the emulator image's fingerprint enrolment. It is
        # a property of the APK, so it holds on any runner.
        #
        # `test` also covers :app:testReleaseUnitTest, and that is load-bearing
        # rather than incidental — do not narrow this step to the debug task.
        # :app is the only module with a release unit-test component (see the
        # androidComponents block in app/build.gradle.kts), and it is where every
        # assertion about the SHIPPED build lives: BiometricUnlockFlagTest's
        # biometrics-on branch is only exercised there. It is also the only variant
        # that catches the Robolectric trap in BIT-106, where a test written with
        # `createComposeRule()` cannot resolve its activity on release and dies
        # before its first assertion. ComposeRuleVariantGuardTest now fails that on
        # debug too, so it is caught locally, but the release task is the backstop.
        run: ./gradlew test --no-daemon

      - name: Say which unit test failed
        # A red `Unit tests` step takes all three emulator jobs with it — they
        # `needs: build` and go SKIPPED — so BIT-59's own job never executes.
        # That happened on run 42 and again on run 47, and run 47 cost a full
        # round of work to the fact that nothing about the failure was readable
        # from outside this runner:
        #
        #   - /actions/jobs/{id}/logs answers 403 "Must have admin rights to
        #     Repository", to every token available here and to none, even though
        #     the repo is public and the rest of the Actions API reads fine
        #     anonymously.
        #   - The run page is JS-rendered, so scraping it gives job names without
        #     step conclusions.
        #   - The artifact below is NOT a way out, which is why this step exists
        #     as well as that one. /actions/artifacts/{id}/zip answers 401
        #     "Requires authentication" anonymously and the web download URL 404s
        #     after its redirect: the report is readable by a signed-in human and
        #     by nothing else.
        #
        # What IS readable with no credentials is the check-run annotation list,
        # /repos/{owner}/{repo}/check-runs/{job_id}/annotations. On run 47 it held
        # three entries and they were the whole of what could be recovered: two
        # Node deprecation warnings and "Process completed with exit code 1."
        #
        # So the diagnosis is put where the annotations are. This step re-states
        # each failing testcase from Gradle's JUnit XML as a `::error::` command,
        # which lands in that list. Always exits 0 — the step above has already
        # failed the job, and failing twice would just replace one uninformative
        # failure with another.
        if: failure()
        run: python3 android/scripts/report-test-failures.py

      - name: Upload unit test report
        # if: failure(), not always(). On green this report says nothing that the
        # step's own exit code did not, and `test` across every module is a lot of
        # HTML to keep for seven days per push.
        #
        # The companion to the step above, for the reader it can serve: a human
        # who is signed in. It carries the full HTML report and the untruncated
        # stack traces, where the annotations carry the first 1200 characters of
        # at most ten failures. It costs nothing to keep; it is simply not the
        # channel the agents working this repo can read.
        #
        # Both paths, for the reason the module list in the step above gives: the
        # pure-Kotlin modules write plain `test` results and the Android ones write
        # `testDebugUnitTest`, and the glob has to cover whichever module broke.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          # XML first: it is the machine-readable half, and for a crash-before-
          # assertion failure (Robolectric's targetSdk abort in run 42 was one) the
          # stack trace lands in the XML's system-err where the HTML summary shows
          # only a count.
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/**
          retention-days: 7
          # Not `error`. This step only runs when the job already failed, and a
          # failure early enough to produce no reports at all — a Kotlin compile
          # error in a test source set — is a real outcome that must not be
          # overwritten by an upload error pointing at the wrong cause.
          if-no-files-found: warn

      - name: Compile the instrumented tests
        working-directory: android
        # This step used to say "compiled, not run — running it needs a device;
        # the issue's Remaining section names that as the open item". BIT-62 closed
        # that item: the `instrumented` job below runs the same source set on a
        # booted emulator. What this step is now is the FAST half of the pair.
        #
        # Keeping it is not redundancy. `instrumented` costs an emulator boot and
        # runs on a different runner; a Kotlin compile error in androidTest should
        # go red here, in the same minute as every other compile error, rather than
        # after an AVD has come up. It also still guards the case where the
        # emulator job is skipped or unavailable: the source set is never left with
        # nothing looking at it.
        # That matters most for CrossOriginIframeIsolationTest, which is BIT-58's
        # definition of done: the test that drives a real cross-origin iframe at a
        # real WebView and asserts the wallet does not react. A requirement whose
        # only evidence is a file that no longer compiles is a comment.
        #
        # Compiling is genuinely less than running. The `instrumented` job below
        # now runs them on an emulator, which is what BIT-33 §Acceptance 3 and 4
        # actually ask for; this step is kept anyway because it fails in about a
        # minute where that job fails after a boot.
        #
        # ALL THREE MODULES, not just :feature:website. This step covered one of
        # the three androidTest source sets the emulator jobs run, so a Kotlin
        # error in BackupExclusionTest or KeystoreKeyInfoTest compiled nowhere in
        # the fast half and surfaced only after the `wallet-instrumented` job had
        # booted an AVD — a 45-minute timeout's worth of feedback loop for a
        # missing import. The asymmetry was an accident of BIT-62 landing before
        # BIT-59, not a decision.
        #
        # Listed with `:app` last because it is the slowest and depends on
        # :core:wallet-ldk anyway (androidTestImplementation), so the library
        # modules are built first regardless. Gradle picks the order from the
        # task graph rather than from this list — the ordering here is for the
        # reader, not a guarantee.
        run: |
          ./gradlew --no-daemon \
            :feature:website:assembleDebugAndroidTest \
            :core:wallet-ldk:assembleDebugAndroidTest \
            :app:assembleDebugAndroidTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  maestro:
    name: Maestro smoke (emulator)
    # The emulator job is the one with a hardware requirement (KVM), so it is the
    # one that gets to move hosts. Set the repository variable
    # ANDROID_EMULATOR_RUNNER to a self-hosted label to move it; unset, it stays on
    # GitHub-hosted runners, which have KVM and need no provisioning.
    #
    # The variable holds a JSON array, and fromJSON is load-bearing: runs-on matches
    # a *list* of labels, so a bare "self-hosted,linux,x64" string becomes one label
    # that matches no runner — and the symptom is a job queued forever, not an error.
    #
    # Prerequisites for a self-hosted host are in android/docs/self-hosted-runner.md.
    # The preflight step below fails fast and points there rather than letting a
    # misprovisioned host burn the 30-minute timeout.
    runs-on: ${{ fromJSON(vars.ANDROID_EMULATOR_RUNNER || '["ubuntu-latest"]') }}
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mark job start
        # BIT-5 asks for the wall-clock number, and until this step the workflow
        # produced no number at all — you had to read the durations off the run
        # page and add them up by eye, once per run, three times. Worse, the
        # emulator-runner step is a single timed unit covering AVD boot, install
        # and the flow together, so the figure it shows answers "how long does
        # CI take" and not "how long does the flow take", which are different
        # questions with answers minutes apart.
        #
        # Recording the start here lets the run step below decompose it into a
        # table in the job summary, so each run states its own number and three
        # consecutive runs can be compared without anyone doing arithmetic.
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Enable KVM
        # GitHub-hosted Linux runners expose /dev/kvm but not to non-root users by
        # default. Without this the emulator falls back to software rendering and
        # goes from "about a minute to boot" to "does not finish".
        #
        # Deliberately NOT run on self-hosted hosts. There it is provisioning, not a
        # build step: the rule belongs in the host's image (it needs passwordless
        # sudo to apply, and re-applying it on every job is a persistent change made
        # by untrusted-ish job code). See android/docs/self-hosted-runner.md.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preflight — hardware acceleration is actually available
        # Without KVM the emulator does not fail, it crawls: boot goes from ~1
        # minute to past any sane timeout, and the job dies 30 minutes later with
        # "Timeout waiting for emulator to boot" — which reads like a flaky
        # emulator rather than a misconfigured host. Six seconds here saves that.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on runner '${{ runner.name }}'. The emulator needs hardware acceleration; without it this job times out rather than failing. If this is a VM, nested virtualisation must be enabled on the hypervisor. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not read/write for user '$(id -un)'. Add the runner user to the 'kvm' group. See android/docs/self-hosted-runner.md."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM OK on ${{ runner.environment }} runner '${{ runner.name }}' as $(id -un)."

      - name: Preflight — ANDROID_HOME is set
        # android-emulator-runner installs the SDK components itself, but it resolves
        # them against $ANDROID_HOME. GitHub-hosted images set it; a freshly registered
        # self-hosted runner does not. Unset, the action expands the path to the literal
        # string "undefined/cmdline-tools" and the failure surfaces much later as a
        # confusing sdkmanager error rather than a missing variable.
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on runner '${{ runner.name }}'. android-emulator-runner installs the SDK itself but needs somewhere to put it. Export ANDROID_HOME (e.g. /opt/android-sdk, writable by the runner user) in the runner service environment. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          # The emulator step runs `bash android/scripts/ci-smoke.sh`. Present on every
          # normal Linux host, but a minimal container image can ship only dash — and
          # there the failure lands after the emulator has booted, which is precisely
          # the twenty-minute feedback loop this whole preflight exists to avoid.
          if ! command -v bash >/dev/null 2>&1; then
            echo "::error::bash is not installed on runner '${{ runner.name }}'. The emulator step runs a bash script; install bash on the host. See android/docs/self-hosted-runner.md."
            exit 1
          fi

      - name: Install Maestro
        # MAESTRO_VERSION is read by the installer (unset would fetch releases/latest).
        # The version is echoed so each run's log records which Maestro produced its
        # result — without that, comparing three "consecutive" runs assumes something
        # nobody actually checked.
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="${MAESTRO_VERSION}" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-aosp-atd-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted"

      - name: Mark emulator step start
        # Splits the figure the annotation used to call "emulator boot" into the
        # two different things it was silently adding together. JOB_START_EPOCH is
        # marked at the top of the job, so everything between it and the script
        # starting — SDK setup, Maestro's installer, restoring the AVD cache — was
        # being counted as boot. On the three BIT-5 evidence runs that was 20-34s
        # of an 88-107s number: up to a third of "emulator boot" was not the
        # emulator booting.
        #
        # A mislabel here points optimisation work at the wrong step. The honest
        # decomposition is ~68s of actual boot plus 10-21s of downloading Maestro
        # on every single run, and only the second of those is worth caching.
        # Marking immediately before the action makes boot mean boot.
        run: echo "EMULATOR_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Maestro smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # aosp_atd = Automated Test Device: a stripped AOSP image built for CI.
          # No Play Services, no Google apps, materially faster to boot and less
          # prone to a background service waking up mid-flow. The app has no Play
          # Services dependency yet; when FCM lands, this must move to a
          # google_apis image and the boot-time number below gets re-measured.
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # `bash <file>`, not an inline block, and this is load-bearing rather than
          # tidiness. The action runs this input under /usr/bin/sh — dash on the Ubuntu
          # images — not bash, and the first run of this job died on its own first line
          # with "set: Illegal option -o pipefail", after a full emulator boot. Naming
          # the interpreter here makes the script's shell a property of the repo instead
          # of a property of whichever image the runner happens to be.
          #
          # What stays inline must be POSIX; android/scripts/check-action-scripts.sh
          # enforces that in the build job, seconds in rather than an emulator boot in.
          script: bash android/scripts/ci-smoke.sh

      - name: Upload Maestro artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          # --debug-output carries the screenshot-on-failure, the view hierarchy
          # dump at the point of failure, and the maestro log. The hierarchy dump
          # is the one that actually explains "element not found".
          #
          # maestro-video/ is present only when the flow failed — the run step
          # deletes it on green. It covers what a final-frame screenshot cannot:
          # anything that was transient by the time the capture happened.
          path: |
            maestro-debug/**
            maestro-video/**
            maestro-report.xml
            shared/docs/screenshots/signup_create_smoke/**
          retention-days: 14
          if-no-files-found: warn

  instrumented:
    name: S-36 isolation tests (emulator)
    # BIT-62. The `build` job compiles :feature:website's androidTest source set;
    # this job is the only thing in the repo that RUNS it. Until it existed,
    # CrossOriginIframeIsolationTest — BIT-58's definition of done, "the test that
    # would have caught the iOS gap" — had never been executed on anything, and a
    # test that has never run is closer to a comment than to a check.
    #
    # WHY ITS OWN JOB RATHER THAN A STEP IN `maestro`
    #
    # That was the open question on BIT-62, and the answer is three things, in
    # descending order of how much they cost to get wrong.
    #
    # 1. It needs a different system image. The Maestro job runs aosp_atd — an
    #    Automated Test Device, stripped for boot speed — and its AVD snapshot is
    #    cached under a key naming that image. What ATD strips varies by API level
    #    and a WebView provider is a plausible casualty; the Maestro flow drives
    #    Compose UI and would not notice, whereas every single test in this suite
    #    constructs a real android.webkit.WebView and would fail at construction.
    #    Sharing the AVD would mean this suite's correctness depended on a choice
    #    made for a different test's speed. ci-instrumented.sh checks the provider
    #    out loud on every run so the assumption cannot rot silently either way.
    #
    # 2. Red here must mean something different from red there. "The Maestro smoke
    #    flow failed" and "the wallet reacted to a cross-origin iframe" are not the
    #    same news, and one job cannot report them as different news.
    #
    # 3. It costs no wall-clock. Both jobs need only `build`, so on GitHub-hosted
    #    runners they run side by side; the cost is runner-minutes, not waiting.
    #    On a single self-hosted runner they serialise — see
    #    android/docs/self-hosted-runner.md — which is a reason to keep this job's
    #    own timeout honest, not a reason to merge them.
    runs-on: ${{ fromJSON(vars.ANDROID_EMULATOR_RUNNER || '["ubuntu-latest"]') }}
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Mark job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # This job builds the test APK itself rather than downloading the build
        # job's, because `connectedDebugAndroidTest` is the command an engineer
        # runs locally to reproduce a failure, and CI doing something else is how
        # "works on my machine" gets invented. The cache makes the second compile
        # cheap; `am instrument` on a downloaded APK would be faster still and
        # would give up the JUnit XML the vacuity check reads.
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Enable KVM
        # Same rule and the same reasoning as the maestro job above: GitHub-hosted
        # runners expose /dev/kvm but not to non-root users, and on a self-hosted
        # host this belongs in the image rather than in job code.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preflight — hardware acceleration is actually available
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on runner '${{ runner.name }}'. Without hardware acceleration the emulator does not fail, it crawls, and this job dies on its timeout looking like a flaky emulator. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not read/write for user '$(id -un)'. Add the runner user to the 'kvm' group. See android/docs/self-hosted-runner.md."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM OK on ${{ runner.environment }} runner '${{ runner.name }}' as $(id -un)."

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # A different key from the maestro job's on purpose — a different image,
          # for the reason in this job's header. Sharing the key would hand this
          # suite an ATD snapshot and the failure would arrive as nine broken
          # tests rather than as a cache-key mistake.
          key: avd-api34-default-x86_64-webview

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted"

      - name: Run the S-36 isolation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # `default`, not `aosp_atd`: a full AOSP image, which ships a WebView
          # provider. Slower to boot and that is the right trade — the suite is
          # about the WebView, so the component ATD might have stripped is the
          # only component under test.
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # `bash <file>`, not an inline block: the action runs this input under
          # /usr/bin/sh (dash), and a bashism here fails AFTER the emulator has
          # booted. android/scripts/check-action-scripts.sh enforces the shape.
          script: bash android/scripts/ci-instrumented.sh

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          # The XML is what the vacuity check reads and is worth keeping for the
          # same reason the check exists — it is the artefact that distinguishes
          # "nine tests passed" from "nothing ran". The HTML is what a person
          # opens to read a failure's assertion message, which for these tests is
          # several paragraphs long and carries the whole diagnosis.
          path: |
            android/feature/website/build/outputs/androidTest-results/**
            android/feature/website/build/reports/androidTests/**
          retention-days: 14
          if-no-files-found: warn

  wallet-instrumented:
    name: Wallet security tests (emulator)
    # BIT-59. Two of the wallet layer's security claims are written as
    # instrumented tests, and until this job existed neither had ever been
    # executed on anything. A test that has never run is closer to a comment
    # than to a check — and one of these two is a precondition rather than a
    # follow-up, which is what makes this worth its own job.
    #
    # WHAT IT PROVES, AND WHY THE SECOND ONE IS NOT OPTIONAL
    #
    #   KeystoreKeyInfoTest reads KeyInfo back off a key the platform really
    #   generated. KeystoreKeySpecTest already proves what we ASKED for on the
    #   JVM; only this shows what an OEM build actually GAVE us.
    #
    #   BackupExclusionTest is the claim wallet-security-properties.md §4 calls
    #   the one not yet proven. BackupExclusionRulesTest and StateDirLocationTest
    #   prove the CONFIGURATION on the JVM — allowBackup="false", both
    #   <cloud-backup> and <device-transfer> excluding the wallet directory,
    #   every wallet path under no_backup. None of that proves a backup set
    #   produced by a real device contains none of it.
    #
    #   BIT-20 rule 5 makes that a precondition of the `match -> keep` guard.
    #   The seed discriminator proves a state directory is YOURS; it does not
    #   prove it is CURRENT. Same-seed stale state signs fine, and publishing a
    #   revoked commitment hands the whole channel balance to the counterparty —
    #   so the failure the discriminator does not cover is the worse one.
    #
    # A RED BackupExclusionTest IS A VALID OUTCOME
    #
    # Per BIT-20 §5.3 it is a HALT on `match -> keep`, and it goes back to BIT-20
    # with the empirical result attached. Nothing here may be marked
    # continue-on-error or retried to make it go away; see the no-retries rule at
    # the top of this file.
    #
    # WHY ITS OWN JOB RATHER THAN A STEP IN `instrumented`
    #
    # Same three reasons that job gives for not being a step in `maestro`, and
    # the first one applies with the images swapped. `instrumented` runs a
    # `default` image chosen because its suite is entirely about the WebView, and
    # its AVD snapshot is cached under a key naming that choice. This suite needs
    # something that image is not selected for: a working backup transport, i.e.
    # com.android.localtransport, which is an AOSP component and is absent from
    # the Play-flavoured images. Sharing the AVD would make this suite's
    # correctness depend on a choice made for a different test's needs, and the
    # failure would arrive as a vacuous GREEN — no transport means no backup set
    # for any package, which satisfies every "the backup set excludes our files"
    # assertion without proving one. ci-wallet-instrumented.sh checks that out
    # loud before running anything, and the suite's own canary asserts it again
    # from the inside.
    #
    # Second: red here must mean something different from red there. "The wallet
    # reacted to a cross-origin iframe" and "the seed blob reached a backup set"
    # are not the same news, and one job cannot report them as different news.
    #
    # Third: it costs no wall-clock. All three emulator jobs need only `build`,
    # so on GitHub-hosted runners they run side by side. On a single self-hosted
    # runner they serialise — see android/docs/self-hosted-runner.md — which is a
    # reason to keep this job's timeout honest, not a reason to merge them.
    runs-on: ${{ fromJSON(vars.ANDROID_EMULATOR_RUNNER || '["ubuntu-latest"]') }}
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Mark job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # Builds the test APKs here rather than downloading the build job's, for
        # the reason the `instrumented` job gives: `connectedDebugAndroidTest` is
        # the command an engineer runs locally to reproduce a failure, and CI
        # doing something else is how "works on my machine" gets invented. It is
        # also what writes the JUnit XML the vacuity check reads.
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Enable KVM
        # Same rule and the same reasoning as the two jobs above: GitHub-hosted
        # runners expose /dev/kvm but not to non-root users, and on a self-hosted
        # host this belongs in the image rather than in job code.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preflight — hardware acceleration is actually available
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on runner '${{ runner.name }}'. Without hardware acceleration the emulator does not fail, it crawls, and this job dies on its timeout looking like a flaky emulator. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not read/write for user '$(id -un)'. Add the runner user to the 'kvm' group. See android/docs/self-hosted-runner.md."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM OK on ${{ runner.environment }} runner '${{ runner.name }}' as $(id -un)."

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Its own key, for the same reason the other two jobs have their own:
          # a different image for a different reason. Sharing a key would hand
          # this suite a snapshot chosen for the WebView and the failure would
          # arrive as a vacuous green rather than as a cache-key mistake.
          key: avd-api34-aosp-atd-x86_64-backup

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted"

      - name: Run the wallet security tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # `aosp_atd`, matching the Maestro job and NOT the `instrumented` job's
          # `default`. The component this suite depends on is
          # com.android.localtransport — the local backup transport — which is
          # AOSP, present on ATD, and absent from Play-flavoured images where a
          # GMS transport would try to talk to a real Google account instead.
          # Neither test here constructs a WebView, so the reason `instrumented`
          # needs a full image does not apply.
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # `bash <file>`, not an inline block: the action runs this input under
          # /usr/bin/sh (dash), and a bashism here fails AFTER the emulator has
          # booted. android/scripts/check-action-scripts.sh enforces the shape in
          # the build job, seconds in.
          script: bash android/scripts/ci-wallet-instrumented.sh

      - name: Upload wallet instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-instrumented-test-report
          # Both modules, because the suite deliberately spans two — see the
          # header of ci-wallet-instrumented.sh for why BackupExclusionTest
          # cannot live in the library module. Uploading only one would hide
          # exactly the half whose absence this job exists to prevent.
          #
          # The XML is what the vacuity check reads. The HTML is what a person
          # opens to read a failure's assertion message, which for these tests
          # carries the whole diagnosis — including the BIT-20 halt condition.
          path: |
