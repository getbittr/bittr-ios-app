name: K1 — Keystore vs lock-screen mutation

# BIT-18. Does a non-auth-bound Keystore key survive a lock-screen change?
#
# BIT-8 rule 2 wraps the Android seed blob in a Keystore key with no
# setUserAuthenticationRequired(true) and no setUnlockedDeviceRequired(true), on
# the premise that Keystore's documented lock-screen invalidation applies only to
# auth-bound keys. That premise currently rests on AOSP javadoc. This workflow is
# how the emulator half of the matrix stops resting on javadoc.
#
# It produces the five emulator rows of BIT-18's table. The two physical-device
# rows (Samsung, Xiaomi) cannot come from here and are not claimed to: a
# self-hosted runner with a phone on USB could host them one day, but OEM
# behaviour is the entire reason those rows exist and an emulator cannot stand in
# for either. See android/docs/k1-keystore-lockscreen.md.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM android-maestro.yml
#
# Different question, different cost, different cadence. The Maestro workflow is
# the gate on "the Android suite passes"; it must stay fast and must run on every
# push. K1 is a measurement, not a gate — it answers one question about the
# platform, the answer changes only when the platform does, and it costs one
# emulator boot per API level. Folding it into the gate would multiply the cost
# of every Android push by five to re-answer a question nobody asked again.
#
# The harness's own tests do run on every push — they need no device and live in
# the Maestro workflow's build job.

on:
  # Explicit request only. A `push:` filter on the paths this touches would boot
  # five emulators for a comment change in the driver; a `schedule:` would answer
  # the same question every week at some cost and no new information.
  workflow_dispatch:
    inputs:
      api_levels:
        description: 'JSON array of API levels to run. BIT-18 asks for [26,30,33,34,35].'
        required: false
        default: '[26, 30, 33, 34, 35]'
      with_device_owner:
        description: 'Include M6 (dpm set-device-owner). Emulator-only, needs a fresh AVD.'
        type: boolean
        required: false
        default: false

  # The escape hatch, and it is not optional convenience. GitHub only offers the
  # workflow_dispatch button once the workflow file exists on the DEFAULT branch.
  # Until this reaches it, dispatch cannot be triggered at all and the block that
  # BIT-18 has been sitting behind would simply move from "no device" to "no
  # button". Pushing a `k1-run/**` branch is therefore the way a run is requested
  # before merge — the same trick android/docs/ci-evidence.md uses for BIT-5.
  #
  # The ref pattern is deliberately one nobody lands feature work on, so ordinary
  # Android branches never pay for an emulator boot they did not ask for. The
  # branch name also carries how many: `k1-run/26-30-33-34-35` runs five images,
  # a name with no digits in it runs one. See the `plan` job.
  push:
    branches:
      - 'k1-run/**'

concurrency:
  # Every run gets its own group. K1 runs are evidence: a run that gets cancelled
  # by the next one is a row that silently never happened, and on a single
  # self-hosted runner the cancelled run greys out while still QUEUED, which reads
  # as "someone cancelled it" rather than "the harness ate the result". Same
  # reasoning, at more length, in android-maestro.yml.
  group: k1-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'

jobs:
  plan:
    # Ten seconds on a hosted runner to decide how many emulator boots the
    # expensive job is allowed, because the two ways of triggering this want
    # different answers and neither should be the silent default.
    #
    # A dispatch is deliberate and says what it wants in its input. A push to
    # `k1-run/**` is usually the first run of a change to the harness, where
    # booting five images to watch the same mistake five times is pure cost — so
    # a bare branch name gets ONE image, the one this project's runner is known
    # to boot. Ask for more by naming them: `k1-run/26-30-33-34-35`.
    runs-on: ubuntu-latest
    outputs:
      levels: ${{ steps.levels.outputs.json }}
    steps:
      - name: Decide which API levels to run
        id: levels
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.api_levels }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_INPUT:-}" ]; then
            json="$DISPATCH_INPUT"
            why="the dispatch input"
          else
            # k1-run/26-30-33-34-35 -> [26,30,33,34,35]; k1-run/pilot -> empty
            levels=$(printf '%s' "${REF_NAME#k1-run/}" | tr -cs '0-9' ' ' | tr -s ' ')
            levels=$(printf '%s' "$levels" | sed 's/^ //; s/ $//')
            if [ -n "$levels" ]; then
              json="[$(printf '%s' "$levels" | tr ' ' ',')]"
              why="the branch name"
            else
              json='[34]'
              why="the default — the branch named no API levels"
            fi
          fi
          echo "K1 will run API levels $json ($why)." >>"$GITHUB_STEP_SUMMARY"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  matrix:
    needs: plan
    name: K1 on API ${{ matrix.api }}
    # Same runner selection as the Maestro emulator job: set the repository
    # variable ANDROID_EMULATOR_RUNNER to move it to a self-hosted host, unset it
    # to roll back. fromJSON is load-bearing — runs-on matches a LIST of labels,
    # and a bare comma-separated string becomes one label matching no runner, so
    # the symptom is a job queued forever rather than an error.
    runs-on: ${{ fromJSON(vars.ANDROID_EMULATOR_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    strategy:
      # A divergent API level is the RESULT, not a reason to abandon the other
      # rows. If API 30 comes back red, the table still needs 26, 33, 34 and 35 to
      # say whether it is an outlier or the rule.
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.plan.outputs.levels) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Pick the system image for this API level
        # `default`, never `aosp_atd`, and that is a K1-specific choice.
        #
        # aosp_atd (Automated Test Device) is the fast stripped image the Maestro
        # job uses, and it is the right one there: that job needs a framework to
        # run an app against and nothing else. K1 is the opposite case. The thing
        # it measures IS the lock screen, and ATD images are stripped precisely by
        # removing components an automated test is assumed not to need — so the
        # one image family whose removals could silently invalidate every row is
        # the one this workflow must not use. A row measured on a device that
        # cannot hold a lock screen is not a cheap row, it is a wrong one.
        #
        # Run #3 is what makes this concrete rather than cautious: on aosp_atd
        # API 34, `locksettings set-pin` exited 0 and the device then reported
        # isDeviceSecure=false, so M2-M5 sealed against a start state that was
        # never reached. The driver now refuses such an image up front
        # (lockscreen_preflight in k1-lockscreen-matrix.sh) instead of producing
        # rows about it, and this step stops handing it one.
        #
        # Cost: `default` boots slower than ATD. K1 runs on explicit dispatch and
        # answers a question whose answer changes only when the platform does, so
        # boot time is not a constraint worth one unreliable row.
        #
        # The API 26 row is x86 because API 26 `default` has no x86_64 image. That
        # is fine HERE and only here: :core:keystore-probe has no native code and
        # no ldk-node dependency, so nothing in this APK needs an ABI ldk-node
        # ships. BIT-6's wallet-core tests are the opposite — the ldk-node AAR
        # ships x86_64 and no x86 — so do not copy this line into that job.
        id: image
        run: |
          set -euo pipefail
          case "${{ matrix.api }}" in
            26) echo "target=default"   >> "$GITHUB_OUTPUT"
                echo "arch=x86"         >> "$GITHUB_OUTPUT" ;;
            *)  echo "target=default"   >> "$GITHUB_OUTPUT"
                echo "arch=x86_64"      >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Enable KVM
        # GitHub-hosted Linux runners expose /dev/kvm but not to non-root users.
        # Deliberately not run on self-hosted hosts, where this belongs in the
        # host image rather than in job code — see android/docs/self-hosted-runner.md.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preflight — hardware acceleration is actually available
        # Without KVM the emulator does not fail, it crawls, and the job dies at
        # the timeout with "Timeout waiting for emulator to boot" — which reads
        # like a flaky emulator rather than a misconfigured host.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on runner '${{ runner.name }}'. The emulator needs hardware acceleration; without it this job times out rather than failing. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not read/write for user '$(id -un)'. Add the runner user to the 'kvm' group. See android/docs/self-hosted-runner.md."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM OK on ${{ runner.environment }} runner '${{ runner.name }}' as $(id -un)."

      - name: Preflight — ANDROID_HOME is set
        # android-emulator-runner installs the SDK itself but resolves it against
        # $ANDROID_HOME. Unset, the path expands to the literal "undefined/..."
        # and surfaces much later as a confusing sdkmanager error.
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on runner '${{ runner.name }}'. See android/docs/self-hosted-runner.md."
            exit 1
          fi
          mkdir -p "$ANDROID_HOME"
          if ! command -v bash >/dev/null 2>&1; then
            echo "::error::bash is not installed on runner '${{ runner.name }}'. The emulator step runs a bash script. See android/docs/self-hosted-runner.md."
            exit 1
          fi

      - name: Build the probe APK
        # k1-lockscreen-matrix.sh builds this itself, so this step is not needed
        # for correctness — it is here to move the Gradle download off the clock
        # while an emulator is booted and idling. The script's own build is then a
        # cache hit. It also means a compile error fails in a minute instead of
        # after a boot.
        run: |
          set -euo pipefail
          cd android
          ./gradlew --quiet :core:keystore-probe:assembleDebugAndroidTest

      - name: Run the K1 matrix
        uses: reactivecircus/android-emulator-runner@v2
        env:
          K1_OUT: k1-results/api-${{ matrix.api }}.md
          K1_API_LEVEL: ${{ matrix.api }}
          K1_WITH_DEVICE_OWNER: ${{ github.event.inputs.with_device_owner == 'true' && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ steps.image.outputs.target }}
          arch: ${{ steps.image.outputs.arch }}
          # force-avd-creation and -no-snapshot-save together, and both matter
          # here in a way they do not in the Maestro job. This matrix sets,
          # changes and removes the device's lock screen, and under M6 it makes
          # the probe a device owner — a state no factory reset short of AVD
          # deletion undoes. A cached or snapshotted AVD would carry that into
          # every later run on this host, and the symptom would be M6 failing to
          # set up on a machine nobody had touched. Every run starts from a device
          # with no credential, which is also what M1 requires to mean anything.
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # POSIX one-liner: the action runs this under dash, not bash.
          script: bash android/scripts/k1-ci.sh

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-api-${{ matrix.api }}
          path: k1-results/**
          # A missing table is itself worth seeing as a warning rather than a
          # silent green artefact step.
          if-no-files-found: warn
          retention-days: 90
